<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B9A6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="finale">
<title>FINALE · 영어 기말 대비</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#FFFFFF;--soft:#F5F4FB;--soft2:#E6F1E9;--line:#E8E6F2;--ink:#1B1C24;--sub:#6E7080;--pri:#5B9A6E;--pri2:#7DB68C;--deep:#3E7350;--hl:#FFE38A;--hlink:#1B1C24;--good:#1F9D68;--bad:#E5484D;--badsoft:#FDECEC;--warn:#F4EEE5;--warnbar:#C58A2A;color-scheme:light;font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111117;--soft:#1B1A24;--soft2:#1E3326;--line:#2C2A3B;--ink:#ECEBF4;--sub:#9C9AB0;--pri:#7FC290;--pri2:#A3D4AF;--deep:#2E5A3C;--hl:rgba(255,214,90,.32);--hlink:#ECEBF4;--good:#4CC995;--bad:#FF7B7F;--badsoft:#3A1E22;--warn:#2B2519;--warnbar:#E0A949;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111117;--soft:#1B1A24;--soft2:#1E3326;--line:#2C2A3B;--ink:#ECEBF4;--sub:#9C9AB0;--pri:#7FC290;--pri2:#A3D4AF;--deep:#2E5A3C;--hl:rgba(255,214,90,.32);--hlink:#ECEBF4;--good:#4CC995;--bad:#FF7B7F;--badsoft:#3A1E22;--warn:#2B2519;--warnbar:#E0A949;color-scheme:dark}
:root[data-fs="l"]{font-size:16.5px} :root[data-fs="xl"]{font-size:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:1rem;line-height:1.6;letter-spacing:-.01em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
button:disabled{cursor:default}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.45rem;color:var(--pri);letter-spacing:-.03em}
.pill{display:flex;align-items:center;gap:6px;background:var(--soft2);color:var(--pri);font-weight:800;border-radius:999px;padding:7px 14px;font-size:.95rem}
main{max-width:760px;margin:0 auto;padding:22px 18px 120px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--sub);font-size:.75rem}
.tabbar button.on{color:var(--pri);font-weight:700}
.tabbar svg{width:24px;height:24px}
body.playing .tabbar,body.playing .top{display:none}
h1.t{font-size:1.75rem;font-weight:800;letter-spacing:-.035em;margin:0}
.st{color:var(--sub);margin:4px 0 22px}
.crumb{color:var(--sub);font-size:.95rem;margin-bottom:12px;display:inline-block}
.hero{background:var(--deep);color:#fff;border-radius:22px;padding:22px;margin-bottom:14px}
.hero small{opacity:.75;font-size:.85rem}
.hero .big{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.hero p{margin:2px 0 14px;opacity:.75}
.hero button{background:rgba(255,255,255,.16);color:#fff;font-weight:700;border-radius:999px;padding:9px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--soft);border-radius:18px;padding:16px;text-align:left;width:100%}
.tile b{display:block;font-size:1.08rem;margin-bottom:2px}
.tile span{color:var(--sub);font-size:.9rem}
.tile.on{background:var(--soft2)}
.tile.on b{color:var(--pri)}
.sec{font-weight:800;margin:26px 0 10px;font-size:1rem}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:5px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px 0;border-radius:12px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(30,60,40,.08)}
.seg.p button.on{background:var(--soft2);color:var(--pri);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--soft);border-radius:999px;padding:7px 15px;font-weight:600;color:var(--sub);font-size:.93rem}
.chip.on{background:var(--soft2);color:var(--pri)}
.chip:disabled{opacity:.35}
.card{background:var(--soft);border-radius:18px;padding:18px;margin-bottom:10px}
.card.w{background:var(--bg);border:1px solid var(--line)}
.prow{display:block;width:100%;text-align:left;background:var(--soft);border-radius:18px;padding:16px 18px;margin-bottom:10px}
.prow b{font-size:1.08rem}
.prow .m{color:var(--sub);font-size:.88rem;margin-top:2px}
.prow .g{font-size:.92rem;margin-top:6px}
.gbtn{display:block;width:100%;text-align:center;color:#fff;font-weight:800;border-radius:999px;padding:14px;background:linear-gradient(90deg,#4E8C61,#7DB68C);box-shadow:0 8px 22px rgba(78,140,97,.28)}
.gbtn:disabled{opacity:.45;box-shadow:none}
.obtn{display:block;width:100%;text-align:center;font-weight:700;border-radius:999px;padding:13px;border:1px solid var(--line);background:var(--bg)}
.ttl{display:flex;align-items:center;gap:10px}
.ttl svg{width:26px;height:26px;color:var(--pri);flex:none}
/* note */
.sumh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.1rem;margin:6px 0 10px}
.sumh::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--pri)}
ul.sum{margin:0 0 8px;padding-left:20px}
ul.sum li{margin:5px 0}
.nh{display:flex;align-items:center;gap:12px;margin:34px 0 12px}
.nh i{font-style:normal;background:var(--pri);color:#fff;font-weight:800;font-size:.85rem;min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.nh h2{font-size:1.2rem;margin:0;font-weight:800;letter-spacing:-.03em}
mark{background:var(--hl);color:var(--hlink);border-radius:3px;padding:0 2px}
.tip{background:var(--soft2);border-left:4px solid var(--pri);border-radius:0 14px 14px 0;padding:13px 16px;margin:12px 0}
.warn{background:var(--warn);border-left:4px solid var(--warnbar);border-radius:0 14px 14px 0;padding:13px 16px;margin:12px 0}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:.93rem}
th{background:var(--soft);text-align:left;font-weight:700;color:var(--sub);padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
td:last-child{border-right:0} tr:last-child td{border-bottom:0}
.en{font-family:Georgia,"Times New Roman","Noto Serif KR",serif;font-size:1.08em;line-height:1.75;letter-spacing:0}
.x{color:var(--bad);text-decoration:line-through}
.okc{color:var(--good);font-weight:700}
.sent{display:block;width:100%;text-align:left;padding:10px 0;border-bottom:1px dashed var(--line)}
.sent .n{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;background:var(--soft2);color:var(--pri);font:700 .75rem system-ui;margin-right:8px;vertical-align:2px}
.sent .ko{display:none;color:var(--pri);margin-top:5px;font-size:.95rem;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6}
.sent.open .ko,.showko .sent .ko{display:block}
.flow{display:flex;flex-direction:column}
.node{background:var(--soft);border-radius:14px;padding:12px 15px}
.node small{display:block;font-weight:800;color:var(--pri);font-size:.82rem}
.node.k{background:var(--soft2);outline:1.5px solid var(--pri)}
.arr{height:22px;display:flex;justify-content:center}
.arr::before{content:"";width:2px;background:var(--pri);opacity:.5}
.chk{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.chk .q{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.chk .q em{font-style:normal;color:var(--pri);margin-right:6px}
.chk .q small{color:var(--sub);font-weight:500;white-space:nowrap}
.chk .a{display:none;margin-top:8px;color:var(--sub);font-size:.94rem}
.chk.open .a{display:block}
/* setup */
.lab{font-weight:700;color:var(--sub);margin:20px 0 8px;font-size:.95rem}
.cb{display:inline-flex;align-items:center;gap:8px;margin:0 14px 10px 0;font-weight:600}
.cb i{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center}
.cb.on i{background:var(--pri);border-color:var(--pri)}
.cb.on i::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.est{display:flex;justify-content:space-between;background:var(--soft);border-radius:14px;padding:14px 16px;margin:20px 0 14px;color:var(--sub)}
.est b{color:var(--pri)}
/* player */
.ptop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.ptop .in{max-width:760px;margin:0 auto;padding:10px 18px 12px}
.ptop .r{display:flex;align-items:center;gap:12px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.ptop b{display:block;font-size:1.15rem}
.ptop small{color:var(--sub)}
.pbar{height:6px;background:var(--soft2);border-radius:3px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4E8C61,#7DB68C);transition:width .3s}
.qhead{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.qhead .no{color:var(--pri);font-weight:800;font-size:1.25rem}
.qhead .tg{background:var(--soft);color:var(--sub);font-size:.82rem;padding:3px 10px;border-radius:6px}
.qhead .fr{margin-left:auto;color:var(--sub);font-size:.82rem}
.qt{font-weight:700;font-size:1.06rem;margin-bottom:14px}
.given{border:1.5px solid var(--ink);border-radius:4px;padding:11px 13px;margin-bottom:14px}
.body{margin-bottom:16px}
.mk{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.mk b{font-family:system-ui,sans-serif;font-size:.82em;color:var(--pri);margin-right:2px}
.blank{display:inline-block;min-width:96px;border-bottom:2px solid var(--ink);text-decoration:none}
.box{text-decoration:none;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;border:1.5px solid var(--line);border-radius:16px;padding:13px 15px}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center}
.opt .c{color:var(--pri);font-weight:700;flex:none}
.opt.sel{border-color:var(--pri);background:var(--soft2)}
.opt.sel .rd{border-color:var(--pri)} .opt.sel .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pri)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--bg))}
.opt.no{border-color:var(--bad);background:var(--badsoft)}
.opt.cut{opacity:.4} .opt.cut .tx{text-decoration:line-through}
.hintb{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--soft2);background:var(--soft2);color:var(--pri);font-weight:700;border-radius:999px;padding:9px 16px;margin-top:14px}
.hbox{background:var(--soft2);border-radius:16px;padding:14px 16px;margin-top:12px}
.hbox b{color:var(--pri);display:block;font-size:.92rem}
.exp{margin-top:16px;border-radius:16px;padding:16px;background:var(--soft)}
.exp .res{font-weight:800;font-size:1.1rem;margin-bottom:6px}
.exp .res.ok{color:var(--good)} .exp .res.no{color:var(--bad)}
.exp ul{padding-left:18px;margin:6px 0}
.exp .okw{color:var(--good);font-weight:700}
.exp .sub{font-weight:700;margin-top:10px}
.kol{color:var(--sub);font-size:.93rem;margin:6px 0 0}
details{margin-top:10px} summary{color:var(--pri);font-weight:700;cursor:pointer}
.pfoot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.pfoot .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 18px}
.pfoot .obtn{flex:1;padding:12px}
.pfoot .gbtn{flex:1.3;padding:12px}
.pfoot span{color:var(--sub);font-size:.92rem;white-space:nowrap}
.score{font-size:3.4rem;font-weight:800;color:var(--pri);letter-spacing:-.04em;text-align:center}
.empty{text-align:center;color:var(--sub);padding:50px 10px}
.empty b{color:var(--ink);display:block;font-size:1.1rem;margin-bottom:4px}
.tf{list-style:none;padding:0;margin:0} .tf li{padding:3px 0}
.row{display:flex;gap:10px;align-items:center}
.sw{width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--pri)} .sw.on::after{left:24px}

h1.t{font-size:1.6rem}
.logo{position:relative}
.logo .spk{font-size:.7em;margin-left:2px;display:inline-block;vertical-align:top;animation:tw 2.4s ease-in-out infinite}
.spk2{display:inline-block;animation:tw 2.4s ease-in-out infinite .6s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.gbtn{position:relative;overflow:hidden;isolation:isolate}
.gbtn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-120%) skewX(-18deg);animation:sheen 4s ease-in-out infinite;z-index:-1;will-change:transform}
.gbtn:disabled::after{display:none}
@keyframes sheen{0%,62%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(330%) skewX(-18deg)}}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#4E8C61 0%,#3E7350 55%,#6CAA7F 100%)}
.hero::before{content:"";position:absolute;width:260px;height:260px;right:-80px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.hero .st2{position:absolute;color:#fff;pointer-events:none;animation:tw 2.8s ease-in-out infinite}
.hero > *{position:relative}
.spark{position:fixed;pointer-events:none;z-index:70;font-size:18px;color:#FFC93C;text-shadow:0 0 8px rgba(255,201,60,.8);animation:burst .95s ease-out forwards}
.spark.v{color:#8CC29B;text-shadow:0 0 8px rgba(167,139,255,.9)}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(120deg);opacity:0}}
.opt.ok{box-shadow:0 0 0 4px color-mix(in srgb,var(--good) 14%,transparent)}
.scrim{position:fixed;inset:0;background:rgba(12,28,18,.38);z-index:40;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,88vw);background:var(--bg);z-index:41;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px;overflow-y:auto;transform:translateX(100%);transition:transform .28s ease}
.drawer.on{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer .hd b{font-size:1.25rem}
.srch{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:11px 16px;margin-bottom:12px}
.srch input{flex:1;border:0;background:none;font:inherit;color:var(--ink);outline:none;min-width:0}
.prof{display:flex;align-items:center;gap:12px;background:var(--soft2);border-radius:18px;padding:14px}
.prof .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#5B9A6E,#7DB68C);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.prof small{color:var(--pri);display:block}
.prof .pill{margin-left:auto;background:var(--bg)}
.dsec{color:var(--sub);font-size:.85rem;margin:20px 0 6px;padding-left:4px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;padding:11px 6px;border-radius:12px;font-size:1.02rem}
.ditem svg{width:22px;height:22px;color:var(--ink)}
.ditem:active{background:var(--soft)}
.days{display:flex;justify-content:space-between;margin:18px 0 26px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--sub);font-size:.85rem}
.day i{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-style:normal;color:#fff}
.day.today i{background:var(--bg);border:2px dashed var(--pri);color:var(--pri)}
.day.today{color:var(--ink);font-weight:700}
.day.done i{background:linear-gradient(135deg,#5B9A6E,#7DB68C);border:0;color:#fff;box-shadow:0 4px 12px rgba(78,140,97,.35)}
.qrow{display:flex;align-items:center;gap:14px;padding:12px 0}
.qrow .ic{width:46px;height:46px;border-radius:50%;background:var(--soft2);color:var(--pri);display:grid;place-items:center;flex:none}
.qrow .ic svg{width:22px;height:22px}
.qrow b{display:block}
.qrow small{color:var(--sub)}
.qrow .pt{margin-left:auto;color:var(--pri);font-weight:800}
.qrow.ok .ic{background:linear-gradient(135deg,#5B9A6E,#7DB68C);color:#fff}
.qbar{height:5px;background:var(--soft2);border-radius:3px;margin-top:5px;overflow:hidden;width:min(220px,50vw)}
.qbar i{display:block;height:100%;background:var(--pri)}
.empty2{border:1px solid var(--line);border-radius:18px;padding:34px 18px;text-align:center}
.empty2 .ico{color:var(--pri);margin-bottom:8px}
.empty2 b{display:block}
.empty2 p{color:var(--sub);font-size:.92rem;margin:4px 0 16px}
.empty2 .row{justify-content:center;flex-wrap:wrap}
.sm{width:auto!important;display:inline-block!important;padding:10px 20px!important}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translate(-50%,20px);background:#24402E;color:#fff;font-weight:700;border-radius:999px;padding:12px 20px;z-index:80;opacity:0;transition:all .3s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

.splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .3s ease}
.splash.out{opacity:0;pointer-events:none}
.splash .lg{position:relative;isolation:isolate;font-size:3rem;font-weight:800;color:var(--pri);letter-spacing:-.04em}
.splash .lg::before{content:"";position:absolute;left:50%;top:50%;width:230px;height:230px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(91,154,110,.30),transparent 62%);z-index:-1;animation:breathe 1.6s ease-in-out infinite}

<script>

/*DATA*/
const P = [
{id:'7-1',L:7,n:1,name:'동물 실험과 의학 발전',gist:'동물 실험과 의학 발전의 상관관계는 법이 만든 것일 뿐, 인과관계의 증거가 아니다.',
s:[
[`Many opponents of animal experimentation argue that not only is modern medicine not the only cause for the decline in mortality, many medical advances that did contribute to human health were not the result of animal experimentation.`,`많은 동물 실험 반대자들은 현대 의학이 사망률 감소의 유일한 원인이 아닐 뿐만 아니라, 인간 건강에 실제로 기여했던 많은 의학적 발전도 동물 실험의 결과가 아니었다고 주장한다.`],
[`Defenders of research have claimed that since there is a strong correlation between the practice of animal experimentation and medical advancement, the former caused the latter.`,`연구 옹호자들은 동물 실험 실행과 의학적 발전 사이에 강한 상관관계가 있으므로 전자(동물 실험)가 후자(의학 발전)를 초래했다고 주장해 왔다.`],
[`Opponents of research reject this inference.`,`연구 반대자들은 이 추론을 거부한다.`],
[`After all, we have independent reasons to expect these phenomena to be correlated.`,`어쨌든 우리에게는 이 현상들이 상관관계가 있을 거라고 예상할 별개의 이유가 있다.`],
[`Since the law prescribes that all new drugs, prosthetic devices, and surgical techniques be tried on animals before they are used in humans, we will subsequently find that all medical advances are correlated with prior experimentation on animals.`,`법이 모든 신약, 보철 장치, 수술 기법을 인간에게 사용하기 전에 동물에게 시험하도록 규정하므로, 그 결과 우리는 모든 의학적 발전이 이전의 동물 실험과 상관관계가 있음을 발견하게 될 것이다.`],
[`Consequently, the correlation between animal experimentation and medical discovery is the result of legal necessity, not evidence that animal experimentation led to medical advances.`,`따라서 동물 실험과 의학적 발견 사이의 상관관계는 법적 필요성의 결과이지, 동물 실험이 의학 발전을 이끌었다는 증거가 아니다.`],
[`Moreover, several influential physicians have offered historical evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest.`,`게다가 몇몇 영향력 있는 의사들은 동물 실험이 옹호자들이 말하는 만큼 생의학적 발견의 원인이 되지는 않았다는 역사적 증거를 제시해 왔다.`],
[`They claim that clinical discoveries played a more substantial role than animal researchers have led us to believe.`,`그들은 임상적 발견이 동물 연구자들이 우리에게 믿게 해 온 것보다 더 중요한 역할을 했다고 주장한다.`]],
w:[['mortality','사망률'],['correlation','상관관계'],['inference','추론'],['prescribe','규정하다'],['prosthetic','보철의'],['subsequently','그 결과, 그 후에'],['necessity','필요성'],['substantial','상당한, 중요한']],
conf:[
['상관관계 ≠ 인과관계','이 지문의 심장이에요. "같이 움직인다(상관)"와 "A 때문에 B가 생겼다(인과)"는 완전히 다른 말! 반대자들은 상관관계 자체는 인정해요. 인과라는 해석만 거부하는 거예요. 내용 일치에서 "상관관계가 없다고 주장한다"는 선지가 나오면 바로 X.'],
['the former / the latter','the former = 앞에 나온 것(animal experimentation), the latter = 뒤에 나온 것(medical advancement). 순서 바꿔서 함정 선지 만들기 딱 좋아요.'],
['this inference가 가리키는 것','바로 앞 문장의 "상관관계가 강하니까 동물 실험이 의학 발전을 일으켰다"는 추론. 함축 의미 문제 단골.'],
['not as ~ as defenders suggest','"전혀 기여 안 했다"가 아니라 "옹호자들 말만큼은 아니다". 정도를 낮춘 말이니까 "전혀"가 들어간 선지는 함정!']],
gram:[
{p:`not only [is modern medicine] not the only cause`,w:`modern medicine is`,e:`부정어구 not only가 절 맨 앞에 오면 주어·동사가 도치돼요. (be동사 + 주어)`},
{p:`that did [contribute] to human health`,w:`contributed`,e:`강조의 조동사 did 뒤에는 동사원형! "정말로 기여했던"`},
{p:`surgical techniques [be] tried on animals`,w:`are`,e:`prescribe(규정하다)처럼 요구·명령을 나타내는 동사의 that절이 '~해야 한다'는 당위를 나타내면 (should) + 동사원형.`},
{p:`expect these phenomena [to be] correlated`,w:`being`,e:`expect + 목적어 + to부정사.`},
{p:`not evidence [that] animal experimentation led`,w:`which`,e:`evidence의 내용을 설명하는 동격 that절이에요. 뒤가 완전한 문장(주어+동사+목적어)이라 관계대명사 which는 불가.`},
{p:`has not been as [responsible] for`,w:`responsibly`,e:`as ~ as를 지우고 보면 has not been responsible → be동사의 보어 자리라 형용사.`},
{p:`clinical discoveries [played] a more substantial role`,w:`playing`,e:`that절 안의 주어 clinical discoveries에 대한 동사 자리예요.`},
{p:`have led us [to believe]`,w:`believe`,e:`lead + 목적어 + to부정사 (~가 …하도록 이끌다).`},
{p:`before they [are used] in humans`,w:`use`,e:`they(신약·보철 장치 등)는 '사용되는' 대상 → 수동태.`}],
voc:[
{p:`the [decline] in mortality`,w:`increase`,e:`현대 의학이 기여한 건 사망률 '감소'.`},
{p:`there is a strong [correlation]`,w:`contrast`,e:`둘이 같이 움직인다는 '상관관계'가 있어야 "전자가 후자를 초래했다"는 추론이 나와요.`},
{p:`Opponents of research [reject] this inference`,w:`accept`,e:`반대자들이니까 옹호자의 추론을 '거부'.`},
{p:`the result of legal [necessity]`,w:`choice`,e:`법이 강제하니까 선택이 아니라 '필요성'.`},
{p:`correlated with [prior] experimentation`,w:`later`,e:`인간에게 쓰기 '전에' 동물 실험 → 이전의(prior).`},
{p:`played a more [substantial] role`,w:`minor`,e:`의사들은 임상적 발견이 '더 중요한' 역할을 했다고 주장. more minor는 논리가 뒤집혀요.`}],
title:{o:[`Is Medicine Really Advanced by Experimenting on Animals?`,`Why the Law Requires Animal Testing Before Human Use`,`Clinical Discoveries: The Forgotten Enemy of Medicine`,`How Animal Experiments Lowered Mortality Rates`,`Physicians Who Changed the History of Medicine`],a:0,e:`글 전체가 "동물 실험 → 의학 발전"이라는 인과를 의심하는 구조예요. ②는 법 규정이 근거로 쓰였을 뿐 중심 내용은 아니고, ④는 반대 입장이에요.`},
topic:{o:[`legal rules for testing new drugs on animals`,`doubts about the causal link between animal experimentation and medical progress`,`the historical role of physicians in clinical research`,`ethical problems of using animals in laboratories`,`major reasons why mortality has declined in modern times`],a:1,e:`상관관계를 인과관계로 착각하지 말라는 반박이 중심. ③은 마지막 근거의 일부일 뿐이에요.`},
imp:{p:`this inference`,o:[`the belief that medical progress came mainly from clinical observation`,`the conclusion that animal testing caused medical advances because the two are closely linked`,`the argument that laws on animal testing should be stricter`,`the idea that modern medicine is the only reason mortality declined`,`the view that physicians exaggerated the value of animal research`],a:1,e:`this는 바로 앞 문장을 가리켜요: 강한 상관관계 → 동물 실험이 의학 발전을 초래. ④는 반대자 주장의 일부를 비튼 함정.`},
blanks:[
{p:`the result of legal necessity`,o:[`the result of legal necessity`,`proof of a direct causal connection`,`a product of scientific curiosity`,`evidence of ethical progress in research`,`an outcome of careful clinical observation`],a:0,e:`앞 문장이 "법이 동물 실험을 의무화한다". 그러니 상관관계는 '법적 필요성'의 결과. 뒤의 not evidence that ~ 과도 대조돼요.`},
{p:`clinical discoveries`,o:[`clinical discoveries`,`animal experiments`,`legal regulations`,`surgical techniques`,`defenders of research`],a:0,e:`의사들의 역사적 증거 = 동물 실험이 생각보다 덜 중요했다 → 그 대신 '임상적 발견'이 더 큰 역할. ②를 넣으면 주장이 정반대가 돼요.`}],
sum:{t:`The strong (A) between animal testing and medical progress does not prove that the former (B) the latter, since it largely reflects legal requirements.`,o:[[`correlation`,`caused`],[`gap`,`caused`],[`correlation`,`prevented`],[`conflict`,`followed`],[`difference`,`enabled`]],a:0,e:`상관관계(correlation)가 있다고 해서 원인(caused)이라는 증거는 아니다. ③ prevented는 "막았다"라 의미가 완전히 달라요.`},
ref:null,
tf:[[`반대자들은 현대 의학이 사망률 감소의 유일한 원인이 아니라고 본다.`,true,`첫 문장 not only is modern medicine not the only cause.`],
[`옹호자들은 상관관계를 인과관계의 근거로 삼는다.`,true,`the former caused the latter.`],
[`법은 신약을 인간에게 쓰기 전에 동물에게 시험하도록 규정한다.`,true,`the law prescribes ~ be tried on animals before ~ humans.`],
[`반대자들은 동물 실험과 의학 발전 사이에 상관관계가 없다고 주장한다.`,false,`상관관계는 인정해요. 그게 인과는 아니라는 것.`],
[`동물 실험과 의학 발견의 상관관계는 과학적 필연성의 결과이다.`,false,`과학적이 아니라 법적 필요성(legal necessity).`],
[`몇몇 의사들은 동물 실험이 생의학 발견에 전혀 기여하지 않았다고 주장한다.`,false,`"옹호자들 말만큼은 아니다"일 뿐, 전혀 X.`],
[`의사들은 임상적 발견이 알려진 것보다 더 중요한 역할을 했다고 본다.`,true,`clinical discoveries played a more substantial role.`],
[`보철 장치는 동물 실험 의무 대상에서 제외된다.`,false,`신약·보철 장치·수술 기법 모두 포함.`]],
irr:[{at:4,s:`Of course, testing on animals remains the most reliable way to ensure that new drugs are safe for humans.`,k:`물론 동물 실험은 신약이 인간에게 안전한지 확인하는 가장 믿을 만한 방법으로 남아 있다.`,e:`'동물 실험·신약·법' 단어가 다 겹쳐서 자연스러워 보이죠? 그런데 이 글은 반대자 입장에서 "상관관계는 법 때문"이라는 논리를 쌓는 중이에요. 갑자기 동물 실험을 옹호하는 말이 끼면 다음 문장 Consequently(따라서 상관관계는 법적 필요성의 결과)와 연결이 끊겨요.`},
{at:6,s:`Such physicians, however, admit that most clinical discoveries would have been impossible without prior tests on animals.`,k:`하지만 그런 의사들은 대부분의 임상적 발견이 사전 동물 실험 없이는 불가능했을 것이라고 인정한다.`,e:`physicians, clinical discoveries 등 앞뒤 단어를 그대로 가져와서 헷갈려요. 하지만 바로 다음 문장 They claim(임상적 발견이 더 중요했다)과 정면으로 모순돼요.`}],
ins:[{i:2,e:`this inference는 바로 앞 문장의 "전자가 후자를 초래했다"는 추론. 그리고 다음 After all이 반대자들의 근거를 시작하니까 그 사이!`},{i:5,e:`Consequently(따라서)는 앞 문장 "법 때문에 모든 의학 발전이 동물 실험과 상관관계를 갖게 된다"의 결론이에요.`},{i:6,e:`Moreover로 두 번째 근거(역사적 증거)를 추가. 다음 문장의 They가 이 문장의 physicians를 받아요.`}],
oi:1,cut:[3,6],oe:`옹호자 주장 + 반대자의 거부(this inference) → After all로 근거 시작(법 규정) → Consequently 결론 + Moreover 추가 근거. this inference, After all, Moreover가 연결 고리예요.`,
flow:[['반대자의 출발점','의학 발전 중 상당수는 동물 실험 덕분이 아니다'],['옹호자의 추론','동물 실험 ↔ 의학 발전: 상관관계 강함 → 그러니 동물 실험이 원인!'],['반박 ① 법적 필요성','법이 "사람한테 쓰기 전 동물 실험"을 의무화 → 모든 의학 발전은 당연히 동물 실험과 같이 나타남'],['반박 ② 역사적 증거','영향력 있는 의사들: 임상적 발견이 더 중요했다'],['결론','상관관계 ≠ 인과관계']],
ana:`비유하면 이래요. 우리 학교 학생들은 시험 날 전부 교복을 입어요. 그래서 "성적 좋은 학생은 모두 교복을 입었다"는 상관관계가 생기죠. 그렇다고 교복이 성적을 올렸다고 할 수 있나요? 아니죠, 교칙상 원래 입어야 하니까요. 법이 동물 실험을 의무화한 것 = 교칙이 교복을 의무화한 것!`},

{id:'7-3',L:7,n:3,name:'AI와 인간의 공진화',gist:'AI와 인간 의식은 서로 영향을 주며 함께 진화하므로, AI와의 관계를 의식 있는 존재 간의 공존으로 봐야 한다.',
s:[
[`The evolution of AI is often associated with the concept of singularity.`,`AI의 진화는 종종 특이점이라는 개념과 연관된다.`],
[`Singularity refers to the point at which AI exceeds human intelligence.`,`특이점은 AI가 인간의 지능을 넘어서는 지점을 가리킨다.`],
[`After that point, it is predicted that AI will repeatedly improve itself and evolve at an accelerated pace.`,`그 지점 이후 AI는 스스로를 반복적으로 개선하며 가속화된 속도로 진화할 것으로 예측된다.`],
[`When AI becomes self-aware and pursues its own goals, it will be a conscious being, not just a machine.`,`AI가 자기 인식을 하고 자신의 목표를 추구하게 되면, 그것은 단지 기계가 아니라 의식 있는 존재가 될 것이다.`],
[`AI and human consciousness will then begin to evolve together.`,`그러면 AI와 인간의 의식은 함께 진화하기 시작할 것이다.`],
[`Our consciousness will evolve to new dimensions through our interactions with AI, which will provide us with intellectual stimulation and inspire new insights and creativity.`,`우리의 의식은 AI와의 상호 작용을 통해 새로운 차원으로 진화할 것이며, 그 상호 작용은 우리에게 지적 자극을 주고 새로운 통찰과 창의성을 불어넣을 것이다.`],
[`Conversely, our consciousness also has a significant impact on the evolution of AI.`,`반대로, 우리의 의식 또한 AI의 진화에 중대한 영향을 미친다.`],
[`The direction of AI's evolution will depend greatly on what values and ethics we incorporate into AI.`,`AI 진화의 방향은 우리가 어떤 가치와 윤리를 AI에 통합하느냐에 크게 달려 있을 것이다.`],
[`We need to see our relationship with AI as a mutual coexistence of conscious beings, recognizing its rights and supporting the evolution of its consciousness.`,`우리는 AI의 권리를 인정하고 그 의식의 진화를 지지하면서, AI와의 관계를 의식 있는 존재들의 상호 공존으로 볼 필요가 있다.`]],

irr:[{at:2,s:`Some experts, however, doubt that AI will ever reach the level of human intelligence.`,k:`그러나 일부 전문가들은 AI가 인간 지능 수준에 도달할 수 있을지 의심한다.`,e:`특이점·인간 지능이라는 단어를 그대로 써서 자연스러워 보여요. 하지만 글은 "특이점 이후 일어날 일"을 쭉 전개하는데, 갑자기 특이점 자체를 의심하면 흐름이 끊기죠.`},
{at:5,s:`Moreover, AI has already replaced humans in many repetitive jobs, raising concerns about unemployment.`,k:`게다가 AI는 이미 많은 반복 업무에서 인간을 대체해 실업에 대한 우려를 낳고 있다.`,e:`Moreover로 시작해서 '추가 설명'처럼 보이는 게 함정! 글의 초점은 '의식의 공진화'인데 일자리 문제는 다른 주제예요. 다음 Conversely(반대 방향 영향)와도 이어지지 않아요.`}],

{id:'7-5',L:7,n:5,name:'행동은 정체성에서 나온다',gist:'행동은 정체성의 반영이며, 행동과 정체성이 일치하면 옳은 일을 하는 것이 쉬워진다.',
s:[
[`Your behaviors are usually a reflection of your identity.`,`당신의 행동은 대개 당신의 정체성을 반영한다.`],
[`What you do is an indication of the type of person you believe that you are — either consciously or nonconsciously.`,`당신이 하는 행동은 의식적으로든 무의식적으로든 당신이 스스로를 어떤 유형의 사람이라고 믿는지를 나타낸다.`],
[`Research has shown that once a person believes in a particular aspect of their identity, they are more likely to act according to that belief.`,`연구에 따르면 일단 어떤 사람이 자기 정체성의 특정 측면을 믿게 되면, 그 믿음에 따라 행동할 가능성이 더 높다.`],
[`For example, people who identified as "being a voter" were more likely to vote than those who simply claimed "voting" was an action they wanted to perform.`,`예를 들어, 자신을 '유권자'로 여긴 사람들은 단순히 '투표'를 자신이 하고 싶은 행동이라고 말한 사람들보다 투표할 가능성이 더 높았다.`],
[`Similarly, the person who accepts exercise as the part of their identity doesn't have to convince themselves to train.`,`마찬가지로, 운동을 자기 정체성의 일부로 받아들이는 사람은 운동하라고 스스로를 설득할 필요가 없다.`],
[`Doing the right thing is easy.`,`옳은 일을 하는 것이 쉽다.`],
[`After all, when your behavior and your identity perfectly match, you are no longer pursuing behavior change.`,`결국 행동과 정체성이 완벽하게 일치하면, 당신은 더 이상 행동 변화를 추구하는 것이 아니다.`],
[`You are simply acting like the type of person you already believe yourself to be.`,`당신은 그저 스스로 이미 그렇다고 믿는 유형의 사람처럼 행동하고 있을 뿐이다.`]],

[`연구에 따르면 정체성에 대한 믿음은 행동에 거의 영향을 주지 않는다.`,false,`more likely to act according to that belief.`]],
irr:[{at:3,s:`Interestingly, voter turnout tends to be higher among older citizens than among younger ones.`,k:`흥미롭게도 투표율은 젊은 시민보다 나이 든 시민들 사이에서 더 높은 경향이 있다.`,e:`투표 예시 바로 뒤라 이어지는 것 같죠? 하지만 이 글의 초점은 '정체성 → 행동'이에요. 나이별 투표율은 정체성과 무관한 정보예요.`},
{at:4,s:`Of course, regular exercise also improves our mood and reduces stress.`,k:`물론 규칙적인 운동은 기분도 좋게 하고 스트레스도 줄여 준다.`,e:`운동 예시 바로 뒤에 붙어서 자연스러워 보여요. 하지만 '운동의 효과'는 정체성과 상관없는 이야기. 다음 Doing the right thing is easy와도 연결이 끊겨요.`}],
ins:[{i:4,e:`Similarly = 앞의 투표 예시와 같은 원리의 두 번째 예시(운동).`},{i:6,e:`After all은 앞 문장 "옳은 일을 하는 게 쉽다"의 이유를 설명.`},{i:3,e:`For example: 앞 문장의 '정체성을 믿으면 그에 따라 행동한다'에 대한 첫 예시.`}],
oi:1,cut:[3,5],oe:`주제 보충 + 연구 결과 → For example(투표) + Similarly(운동) → Doing the right thing is easy + After all 이유 + 결론.`,
flow:[['나의 정체성','"나는 ~한 사람이다"라는 믿음'],['행동','그 믿음대로 행동할 가능성 ↑'],['예시','유권자 정체성 → 실제 투표 ↑ / 운동하는 사람 정체성 → 설득 필요 X'],['결과','행동 = 정체성 일치 → 행동 변화 노력 불필요, 그냥 나답게 행동']],
ana:`"나는 매일 단어 외우는 사람이야"라고 진짜 믿는 친구는, 오늘도 단어장을 펴려고 의지력을 쥐어짜지 않아요. 그냥 그게 자기니까요. 반면 "단어 외워야 하는데…"라는 친구는 매일 자기 자신과 싸우죠. 전자가 '정체성', 후자가 '행동 변화 추구'예요.`},

{id:'7-7',L:7,n:7,name:'지루함은 변화 감지 장치',gist:'지루함은 변하지 않는 자극에 대한 신경 반응을 낮춰 새로운 변화를 더 잘 감지하게 하는 장치다.',
s:[
[`Kids tire of their toys, college students get sick of cafeteria food, and sooner or later most of us lose interest in our favorite TV shows.`,`아이들은 장난감에 싫증을 내고, 대학생들은 구내식당 음식에 질리며, 머지않아 우리 대부분은 가장 좋아하는 TV 프로그램에 흥미를 잃는다.`],
[`The bottom line is that we humans are easily bored.`,`요점은 우리 인간이 쉽게 지루해한다는 것이다.`],
[`But why should this be true?`,`그런데 왜 그래야 할까?`],
[`The answer lies buried deep in our nerve cells, which are designed to reduce their initial excited response to stimuli each time they occur.`,`그 답은 우리의 신경 세포 깊숙이 묻혀 있는데, 신경 세포는 자극이 발생할 때마다 그것에 대한 초기의 흥분 반응을 줄이도록 설계되어 있다.`],
[`At the same time, these neurons enhance their responses to things that change — especially things that change quickly.`,`동시에 이 뉴런들은 변하는 것, 특히 빠르게 변하는 것에 대한 반응을 강화한다.`],
[`We probably evolved this way because our ancestors got more survival value, for example, from attending to what was moving in a tree (such as a puma) than to the tree itself.`,`우리는 아마 이런 식으로 진화했을 텐데, 예를 들어 우리 조상들이 나무 그 자체보다 (퓨마처럼) 나무에서 움직이는 것에 주의를 기울이는 것에서 더 많은 생존 가치를 얻었기 때문이다.`],
[`Boredom in reaction to an unchanging environment turns down the level of neural excitation so that new stimuli (like our ancestor's hypothetical puma threat) stand out more.`,`변하지 않는 환경에 대한 반응으로서의 지루함은 신경 흥분 수준을 낮춰서 (조상이 가정한 퓨마의 위협 같은) 새로운 자극이 더 두드러지게 한다.`],
[`It's the neural equivalent of turning off a front door light to see the fireflies.`,`그것은 반딧불이를 보기 위해 현관 불을 끄는 것에 해당하는 신경의 작용이다.`]],

irr:[{at:4,s:`In fact, sudden changes in the environment often make people feel anxious rather than excited.`,k:`실제로 환경의 갑작스러운 변화는 종종 사람들을 들뜨게 하기보다 불안하게 만든다.`,e:`'변화'라는 키워드를 그대로 써서 엄청 헷갈려요. 하지만 글은 신경 세포의 반응(감지)에 대한 이야기이지 '감정(불안)'이 아니에요. 다음 문장 "이렇게 진화했다"의 this way가 가리킬 대상도 사라져요.`},
{at:5,s:`Pumas, which mainly hunt at night, are known for their ability to climb trees quickly.`,k:`주로 밤에 사냥하는 퓨마는 나무를 빠르게 오르는 능력으로 알려져 있다.`,e:`퓨마, 나무가 바로 앞 문장에 나와서 이어지는 것 같죠? 하지만 퓨마는 예시일 뿐, 퓨마의 습성은 지루함·신경 반응과 아무 관련이 없어요.`}],
ins:[{i:2,e:`But why should this be true?의 this = 앞의 "인간은 쉽게 지루해한다". 다음 문장이 The answer로 시작하니까 질문은 그 앞!`},{i:4,e:`At the same time: 같은 자극엔 반응 감소 + 동시에 변하는 것엔 반응 강화. 그리고 다음 문장 this way가 이 두 가지를 받아요.`},{i:7,e:`It's the neural equivalent: 앞에서 설명한 지루함의 작용 전체를 비유로 정리하는 마지막 문장.`}],
oi:2,cut:[4,6],oe:`(시험지 3번과 같은 구성) 인간은 쉽게 지루 → (A) But why? 답은 신경 세포(반응 감소) → (C) At the same time 변화엔 반응 강화 + 진화 이유 → (B) Boredom 결론.`,
flow:[['현상','장난감, 급식, TV 프로그램… 인간은 쉽게 지루해함'],['원인 ①','같은 자극 반복 → 신경 반응 ↓ (reduce)'],['원인 ②','변하는 자극, 특히 빠른 변화 → 신경 반응 ↑ (enhance)'],['진화적 이유','나무(배경)보다 움직이는 퓨마(변화)에 주목해야 살아남음'],['결론','지루함 = 배경 소음 끄기 → 새로운 자극이 잘 보임 (반딧불이 비유)']],
ana:`교실 에어컨 소리는 수업 시작하고 5분만 지나면 안 들리죠? 그런데 누가 뒷문을 드르륵 열면 반 전체 고개가 동시에 돌아가요. 에어컨 소리 = 나무, 문 여는 소리 = 퓨마. 뇌가 에어컨 소리 볼륨을 꺼 줬기 때문에 문소리를 바로 잡아낸 거예요.`},

{id:'7-9',L:7,n:9,name:'부유한 나라의 스트레스',gist:'가난만 스트레스를 주는 게 아니라, 부유한 나라는 빠른 삶의 속도로 인한 시간 압박이라는 고유한 스트레스가 있다.',
s:[
[`Few people will be surprised to hear that poverty tends to create stress: a 2006 study published in the American journal Psychosomatic Medicine, for example, noted that a lower socioeconomic status was associated with higher levels of stress hormones in the body.`,`가난이 스트레스를 유발하는 경향이 있다는 말에 놀랄 사람은 거의 없을 것이다. 예를 들어 미국 학술지 Psychosomatic Medicine에 실린 2006년 연구는 더 낮은 사회 경제적 지위가 체내의 더 높은 스트레스 호르몬 수치와 관련이 있다고 언급했다.`],
[`However, richer economies have their own distinct stresses.`,`하지만 더 부유한 경제(국가)는 그들만의 뚜렷한 스트레스를 가지고 있다.`],
[`The key issue is time pressure.`,`핵심 쟁점은 시간 압박이다.`],
[`A 1999 study of 31 countries by American psychologist Robert Levine and Canadian psychologist Ara Norenzayan found that wealthier, more industrialized nations had a faster pace of life — which led to a higher standard of living, but at the same time left the population feeling a constant sense of urgency, as well as being more prone to heart disease.`,`미국 심리학자 Robert Levine과 캐나다 심리학자 Ara Norenzayan이 31개국을 대상으로 한 1999년 연구는 더 부유하고 더 산업화된 나라들이 삶의 속도가 더 빠르다는 것을 발견했는데, 이것은 더 높은 생활 수준으로 이어졌지만 동시에 사람들에게 끊임없는 촉박함을 느끼게 했고 심장병에도 더 걸리기 쉽게 했다.`],
[`In effect, fast-paced productivity creates wealth, but it also leads people to feel time-poor when they lack the time to relax and enjoy themselves.`,`사실상 빠른 속도의 생산성은 부를 창출하지만, 사람들이 긴장을 풀고 즐길 시간이 부족할 때 시간이 가난하다고 느끼게도 만든다.`]],
w:[['socioeconomic status','사회 경제적 지위'],['be associated with','~와 관련 있다'],['distinct','뚜렷한, 별개의'],['industrialized','산업화된'],['pace of life','삶의 속도'],['urgency','촉박함, 긴급'],['prone to','~에 걸리기 쉬운'],['productivity','생산성']],
conf:[

['time-poor','돈이 가난한 게 아니라 "시간이 가난한" 상태. 함축 의미로 나오기 좋아요.'],
['which의 선행사','— which led to ~ 의 which는 앞 내용(빠른 삶의 속도). 이게 생활 수준 ↑ + 촉박함 + 심장병, 장단점을 동시에 가져와요.'],
['국적 함정','Robert Levine = 미국, Ara Norenzayan = 캐나다. 내용 일치에서 둘 다 미국이라고 바꾸는 함정 주의.']],

ins:[{i:1,e:`However로 가난 → 부유한 경제로 전환. 다음 문장 The key issue가 '부유한 나라 스트레스'의 핵심을 말하니까 그 앞.`},{i:2,e:`앞에서 "고유한 스트레스"라 했으니 그게 뭔지(시간 압박) 밝히고, 뒤에서 연구로 뒷받침.`}],

s:[
[`Have you ever brought up an idea or suggestion to someone and heard them immediately say "No, that won't work."?`,`누군가에게 아이디어나 제안을 꺼냈는데 그 사람이 즉시 "아니, 그건 안 될 거야."라고 말하는 것을 들은 적이 있는가?`],
[`You may have thought, "He/she didn't even give it a chance. How do they know it won't work?"`,`당신은 "그 사람은 기회조차 주지 않았어. 안 될 걸 어떻게 알지?"라고 생각했을지도 모른다.`],
[`When you are right about something, you close off the possibility of another viewpoint or opportunity.`,`당신이 어떤 일에 대해 옳다고 하면, 당신은 다른 관점이나 기회의 가능성을 닫아 버린다.`],
[`Being right about something means that "it is the way it is, period."`,`어떤 일에 대해 옳다는 것은 "원래 그런 거야, 끝."이라는 의미다.`],
[`You may be correct.`,`당신이 맞을 수도 있다.`],
[`Your particular way of seeing it may be true with the facts.`,`그것을 보는 당신의 특정한 방식이 사실에 부합할 수도 있다.`],
[`However, considering the other option or the other person's point of view can be beneficial.`,`하지만 다른 선택지나 다른 사람의 관점을 고려하는 것이 이로울 수 있다.`],
[`If you see their side, you will see something new or, at worse, learn something about how the other person looks at life.`,`그들의 입장을 보면, 당신은 새로운 것을 보게 되거나, 아무리 못해도 다른 사람이 삶을 바라보는 방식에 대해 무언가를 배우게 될 것이다.`],
[`Why would you think everyone sees and experiences life the way you do?`,`왜 모든 사람이 당신과 같은 방식으로 삶을 보고 경험한다고 생각하는가?`],
[`Besides how boring that would be, it would eliminate all new opportunities, ideas, invention, and creativity.`,`그게 얼마나 지루할지는 차치하더라도, 그것은 모든 새로운 기회, 아이디어, 발명, 그리고 창의성을 없앨 것이다.`]],

irr:[{at:3,s:`Indeed, people who are confident in their opinions are often seen as strong leaders.`,k:`실제로 자기 의견에 확신이 있는 사람들은 종종 강한 리더로 여겨진다.`,e:`'옳다는 확신'과 연결돼서 자연스러워 보이죠. 하지만 글은 확신의 '단점(가능성 차단)'을 말하는 중이에요. 확신을 칭찬하는 말이 끼면 방향이 어긋나요.`},
{at:7,s:`Of course, you should not give up your own values just to please others.`,k:`물론 단지 남을 기쁘게 하려고 자신의 가치관을 포기해서는 안 된다.`,e:`Of course로 균형 잡힌 말처럼 보이는 게 함정! 글은 '다른 관점 고려하기'를 밀고 가는데, 갑자기 '내 가치관 지키기'로 초점이 바뀌어요. 다음 Why would you think…와도 안 이어져요.`}],

oi:2,cut:[4,7],oe:`일상 예시 → 옳다는 확신은 가능성을 닫음(정의) → 맞을 수는 있다(양보) → However 다른 관점이 이롭다 → 이유와 결론.`,
flow:[['일상 예시','내 제안에 상대가 즉시 "안 돼" → "기회도 안 줬잖아?"'],['핵심 지적','나도 옳다고 확신하면 똑같이 다른 관점을 닫아 버림'],['양보','내가 맞을 수도 있음, 사실에 부합할 수도 있음'],['However','다른 관점 고려 → 새로운 것을 보거나, 최소한 상대 시각을 배움'],['결론','모두가 같은 시각이면 지루 + 기회·발명·창의성 소멸']],
ana:`수학 문제를 내 방식으로 맞혔다고 해서 친구 풀이를 안 들어 보면 손해예요. 내 답이 맞아도 친구 풀이에 더 빠른 방법이 숨어 있을 수 있고, 최소한 "저렇게도 생각하는구나"는 배우잖아요.`},

{id:'14-1',L:14,n:1,name:'재생 에너지 전환의 숨은 비용',gist:'재생 에너지 기반 시설을 짓는 데에도 화석 연료가 필요하며, 이 비용은 전환 계획에서 거의 고려되지 않는다.',
s:[
[`Richard Heinberg, an American journalist, argues that in building the renewable energy infrastructure to stop global warming, we are actually involved in one of the greatest change projects in human history.`,`미국인 저널리스트 Richard Heinberg는 지구 온난화를 막기 위해 재생 에너지 기반 시설을 구축할 때, 우리가 실제로는 인류 역사상 가장 큰 변화 프로젝트 중 하나에 관여하고 있다고 주장한다.`],
[`However, this project is more difficult and more complex than we might have thought.`,`하지만 이 프로젝트는 우리가 생각했을지도 모르는 것보다 더 어렵고 더 복잡하다.`],
[`In addition to solar panels and wind turbines, we have to build an alternative transport infrastructure, farming procedures and industrial processes.`,`태양광 패널과 풍력 터빈 외에도, 우리는 대체 교통 기반 시설, 농업 절차, 산업 공정을 구축해야 한다.`],
[`This transformation cannot happen without fossil fuels.`,`이 변화는 화석 연료 없이는 일어날 수 없다.`],
[`For instance, production of concrete structures and steel elements requires amounts of energy that is only possible to produce with fossil energy.`,`예를 들어, 콘크리트 구조물과 강철 요소의 생산은 화석 에너지로만 생산할 수 있는 양의 에너지를 필요로 한다.`],
[`Production of solar panels requires scarce and expensive minerals which must be excavated, again requiring the use of fossil fuels.`,`태양광 패널 생산에는 채굴해야 하는 희귀하고 비싼 광물이 필요하며, 이것 역시 화석 연료 사용을 필요로 한다.`],
[`Thus, the harder we push towards a renewable energy system, the faster we have to use fossil energy for the construction process.`,`따라서 우리가 재생 에너지 시스템을 향해 더 강하게 밀고 나갈수록, 건설 과정에서 더 빠르게 화석 에너지를 써야 한다.`],
[`This is not only expensive, but also an undermining factor for our efforts to cut global emissions.`,`이것은 비용이 많이 들 뿐만 아니라, 전 세계 배출량을 줄이려는 우리의 노력을 약화시키는 요인이기도 하다.`],
[`Heinberg remarks that the cost of building this new energy infrastructure is seldom counted in transition proposals, which tend to focus just on energy supply requirements.`,`Heinberg는 이 새로운 에너지 기반 시설을 짓는 비용이 전환 제안에서 거의 계산되지 않는다고 말하는데, 그 제안들은 에너지 공급 요구 사항에만 집중하는 경향이 있다.`]],
w:[['renewable','재생 가능한'],['infrastructure','기반 시설'],['alternative','대체의'],['transformation','변화, 전환'],['fossil fuel','화석 연료'],['scarce','희귀한, 부족한'],['excavate','발굴하다, 채굴하다'],['undermine','약화시키다'],['seldom','거의 ~않는'],['transition','전환']],
conf:[
['역설 구조','재생 에너지로 갈수록 → 화석 연료를 더 빨리 써야 한다. 상식과 반대라서 문제 내기 딱 좋아요. "재생 에너지만으로 충분하다" 선지는 X.'],
['연결사 3종 세트','(A) However: 거대 프로젝트지만 어렵다 / (B) For instance: 화석 연료 필요의 예시 / (C) Thus: 결론. (시험지 7번)'],
['seldom = 거의 ~않는','부정어예요! "비용이 거의 계산되지 않는다". 내용 일치에서 "항상 계산된다"로 바꾸는 함정. (시험지 8번 ⓕ는 일치)'],
['제안들이 집중하는 것','에너지 "공급 요구"에만 집중. 건설 비용에 집중한다고 바꾸면 X.']],

irr:[{at:3,s:`Many countries have already succeeded in replacing most of their fossil fuel use with solar power.`,k:`많은 나라가 이미 화석 연료 사용 대부분을 태양광 발전으로 대체하는 데 성공했다.`,e:`화석 연료, 태양광이 다 나와서 소재는 같아요. 그런데 바로 앞이 "화석 연료 없이는 불가능"인데 "이미 대체에 성공"이라니 정면 충돌! 다음 For instance(화석 연료가 필요한 예시)와도 안 맞아요.`},
{at:6,s:`Fortunately, the price of solar panels has fallen sharply over the past decade.`,k:`다행히도 태양광 패널 가격은 지난 10년간 급격히 떨어졌다.`,e:`태양광 패널, 비용 이야기라서 이어지는 것 같지만, 글이 말하는 비용은 '건설에 드는 화석 연료 비용'이에요. 패널 가격 하락은 논지와 무관하고 다음 This(화석 에너지를 더 빨리 써야 하는 것)의 지칭도 꼬여요.`}],
ins:[{i:1,e:`this project = 앞 문장의 greatest change projects. However로 "그런데 생각보다 어렵다"고 전환.`},{i:3,e:`This transformation = 앞 문장의 교통·농업·산업 전환. 다음 For instance가 화석 연료 필요의 예시를 시작.`},{i:6,e:`Thus로 앞의 예시들(콘크리트·강철·광물)을 결론으로 정리. 다음 This가 '화석 에너지를 더 빨리 써야 함'을 받음.`},{i:8,e:`마지막에 Heinberg의 말로 '이 비용이 무시된다'고 마무리.`}],

flow:[['Heinberg의 주장','재생 에너지 기반 시설 구축 = 인류 최대 변화 프로젝트'],['However','생각보다 어렵고 복잡 (교통·농업·산업까지 바꿔야)'],['역설','이 전환은 화석 연료 없이 불가능'],['For instance','콘크리트·강철 생산 / 태양광 광물 채굴 → 모두 화석 에너지'],['Thus','재생 에너지로 빨리 갈수록 → 화석 에너지를 더 빨리 씀 → 비싸고 배출 감축에 역행'],['숨은 문제','전환 계획은 에너지 공급만 보고 건설 비용은 거의 계산 안 함']],
ana:`방 대청소를 떠올려 보세요. 깨끗한 방을 만들려면 일단 서랍을 다 꺼내서 방이 더 엉망이 되는 단계를 거쳐야 하죠. 재생 에너지라는 '깨끗한 방'을 만드는 동안 화석 연료라는 '어질러짐'이 오히려 커지는 거예요.`},

{id:'14-3',L:14,n:3,name:'식물의 SOS 신호',gist:'식물은 냄새와 들리지 않는 소리로 스트레스 신호를 보내는데, 이는 고통의 표현이 아니라 생존을 위한 자동적 방어 반응이다.',
s:[
[`Plants can communicate, although not in the same way we do.`,`식물은 우리와 같은 방식은 아니지만 의사소통을 할 수 있다.`],
[`Some express their discontent through scents.`,`어떤 식물은 냄새를 통해 불만을 표현한다.`],
[`You know that smell that hangs in the air after you've mowed the lawn?`,`잔디를 깎고 난 후 공기 중에 감도는 그 냄새 알지?`],
[`Yeah, that's actually an SOS.`,`그래, 그건 사실 구조 신호다.`],
[`Some plants use sound.`,`어떤 식물은 소리를 사용한다.`],
[`Yes, sound, though at a frequency that we can't hear.`,`그래, 소리다. 비록 우리가 들을 수 없는 주파수이긴 하지만.`],
[`Researchers experimented with plants and microphones to see if they could record any trouble calls.`,`연구자들은 곤경을 알리는 소리를 녹음할 수 있는지 알아보려고 식물과 마이크로 실험했다.`],
[`They found that plants produce a high-frequency clicking noise when stressed and can make different sounds for different stressors.`,`그들은 식물이 스트레스를 받으면 고주파의 딸깍거리는 소리를 내고, 스트레스 요인에 따라 다른 소리를 낼 수 있다는 것을 발견했다.`],
[`The sound a plant makes when it's not getting watered differs from the one it'll make when a leaf is cut.`,`식물이 물을 공급받지 못할 때 내는 소리는 잎이 잘릴 때 낼 소리와 다르다.`],
[`However, it's worth noting that experts don't think plants are crying out in pain.`,`하지만 전문가들은 식물이 고통으로 울부짖는다고 생각하지 않는다는 점에 주목할 가치가 있다.`],
[`It's more likely that these reactions are knee-jerk survival actions.`,`이러한 반응은 자동적인 생존 행동일 가능성이 더 크다.`],
[`Plants are living organisms, and their main objective is to survive.`,`식물은 살아 있는 유기체이며, 그들의 주된 목적은 살아남는 것이다.`],
[`Scents and sounds are their tools for defending against things that might harm them.`,`냄새와 소리는 자신에게 해를 끼칠 수도 있는 것들로부터 방어하기 위한 도구이다.`]],
w:[['discontent','불만'],['scent','냄새'],['mow','(잔디를) 깎다'],['frequency','주파수'],['stressor','스트레스 요인'],['knee-jerk','자동적인, 반사적인'],['organism','유기체'],['objective','목적']],
conf:[

const C=['①','②','③','④','⑤'];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

function loc(text,p){const ctx=p.replace(/[\[\]]/g,'');const at=text.indexOf(ctx);if(at<0)return null;const b=p.indexOf('[');if(b<0)return{st:at,en:at+ctx.length,inner:ctx};const e=p.indexOf(']');const inner=p.slice(b+1,e);return{st:at+b,en:at+b+inner.length,inner}}
function mark(text,spans){spans=spans.slice().sort((x,y)=>x.st-y.st);let h='',i=0;for(const s of spans){h+=esc(text.slice(i,s.st));const inner=s.html!=null?s.html:esc(s.rep!=null?s.rep:text.slice(s.st,s.en));h+=`<span class="mk ${s.cls||''}">${s.label?`<b>${s.label}</b>`:''}${inner}</span>`;i=s.en}return h+esc(text.slice(i))}
function pick(text,items,n){const L=shuf(items.map(it=>({it,l:loc(text,it.p)})).filter(x=>x.l));const out=[];for(const x of L){if(out.length>=n)break;if(out.some(o=>!(x.l.en<=o.l.st||x.l.st>=o.l.en)))continue;out.push(x)}return out.sort((a,b)=>a.l.st-b.l.st)}
function so(opts,a){const idx=shuf(opts.map((_,i)=>i));return{o:idx.map(i=>opts[i]),a:idx.indexOf(a)}}

 return{t:'어법',q:'다음 글의 밑줄 친 부분 중, 어법상 <u>틀린</u> 것은?',body,o:sp.map((x,i)=>esc(i===w?x.it.w:x.l.inner)),a:w,e}}
function gGramABC(p){const t=full(p);const sp=pick(t,p.gram,3);if(sp.length<3)return null;const L=['(A)','(B)','(C)'];
 const body=mark(t,sp.map((x,i)=>{const pair=Math.random()<.5?[x.l.inner,x.it.w]:[x.it.w,x.l.inner];return{st:x.l.st,en:x.l.en,label:L[i],cls:'box',html:`[ ${esc(pair[0])} / ${esc(pair[1])} ]`}}));
 const combos=[...Array(8).keys()];const others=shuf(combos.slice(1)).slice(0,4);const pickd=shuf([0,...others]);

function gOrder(p){const oi=p.oi||1,[c0,c1]=p.cut;const ch=[[oi,c0],[c0,c1],[c1,p.s.length]].map(([a,b])=>p.s.slice(a,b));
 const lab=shuf(['A','B','C']);const ans=lab.join('-');const perms=['A-B-C','A-C-B','B-A-C','B-C-A','C-A-B','C-B-A'];
 const oth=shuf(perms.filter(x=>x!==ans)).slice(0,4);const opts=perms.filter(x=>x===ans||oth.includes(x));
 const body=['A','B','C'].map(L=>{const k=lab.indexOf(L);return`<p>(${L}) ${esc(ch[k].map(x=>x[0]).join(' '))}</p>`}).join('');
 const e=`<p>정답 순서: <span class="okw">${lab.map(x=>'('+x+')').join(' – ')}</span></p><p>${p.oe}</p>${lab.map((L,k)=>`<p class="kol">(${L}) ${esc(ch[k].map(x=>x[1]).join(' '))}</p>`).join('')}`;

function gIns(p,it){const i=it.i;const R=p.s.filter((_,j)=>j!==i);const n=R.length;const m=Math.min(5,n);
 const lo=Math.max(1,i-m+1),hi=Math.min(i,n-m+1);const st=lo+rnd(hi-lo+1);let h='';
 for(let j=0;j<n;j++){if(j>=st&&j<st+m)h+=` <b>( ${C[j-st]} )</b> `;h+=esc(R[j][0])+' '}

 return{t:'무관한 문장',q:'다음 글에서 전체 흐름과 관계 <u>없는</u> 문장은?',body,o:C.slice(0,m),a:d-st,e:`<p>${it.e}</p><p class="kol">끼어든 문장 해석: ${esc(it.k)}</p>`}}

let TM=null;function stopTimer(){if(TM){clearInterval(TM);TM=null}}

function playType(id,t){const p=byId(id);const list=[];for(let k=0;k<5;k++){const q=gen(p,t);if(q)list.push(q)}startPlay(`${pLabel(p)} ${t}`,list,'set')}
function playWrong(){const w=loadW();startPlay('오답 다시 풀기',w.slice(0,30),'wrong')}
function playOneWrong(i){const w=loadW();startPlay('오답 다시 풀기',[w[i]],'wrong')}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const TIP={'제목':'첫 문장과 마지막 문장, 그리고 However·Thus 뒤에 필자의 핵심이 있어요. 예시 속 단어만 담은 선지는 함정이에요.','주제':'예시를 빼고 남는 일반적인 말이 주제예요. 한쪽 면만 담은 선지는 반쪽짜리!','함축 의미':'밑줄 바로 앞뒤 문장이 밑줄을 풀어서 설명해 줘요. 앞뒤부터 읽어 보세요.','어법':'동사 자리인지 준동사 자리인지, 주어가 단수인지 복수인지, 뒤 문장이 완전한지부터 확인해요.','어휘':'밑줄 단어를 반의어로 바꿔 넣어 보세요. 바꾼 쪽이 앞뒤 논리에 더 맞으면 그게 정답이에요.','빈칸':'빈칸은 주제문인 경우가 많아요. 예시들이 공통으로 말하는 게 뭔지 찾아보세요.','순서':'(A)(B)(C) 첫머리의 지시어(this, these)와 연결사(However, Thus)가 앞에 뭐가 와야 하는지 알려 줘요.','삽입':'주어진 문장의 지시어·연결사를 보고, 흐름이 뚝 끊기는 빈틈을 찾으세요.','요약':'요약문은 주제문을 바꿔 쓴 거예요. 주제문부터 찾고 (A)(B)를 맞춰 보세요.','지칭':'밑줄마다 그 자리에 명사를 넣어 보세요. 사람인지 사물인지부터 가르면 쉬워요.','내용 일치':'"전혀, 오직, 항상" 같은 극단적인 말이나 숫자·국적이 바뀐 선지가 없는지 체크!','무관한 문장':'단어가 겹친다고 관련 있는 게 아니에요. 앞 문장의 논리 방향과 다음 문장의 지시어가 이어지는지 보세요.'};
function vPlay(){const Z=S.play;const q=Z.list[Z.i];const n=Z.list.length;const done=Z.done[Z.i];const p=byId(q.pid);const dc=Z.done.filter(Boolean).length;
 document.body.classList.add('playing');
 let h=`<div class="ptop" style="margin:-22px -18px 18px"><div class="in"><div class="r"><button class="ib" onclick="quitPlay()" aria-label="나가기">←</button><div><b>${esc(Z.title)}</b><small>⏱ <span id="tm">${fmt(Math.floor((Date.now()-Z.t0)/1000))}</span> · 진행 ${dc}/${n}</small></div></div><div class="pbar"><i style="width:${dc/n*100}%"></i></div></div></div>`;
 h+=`<div class="qhead"><span class="no">${Z.i+1}.</span><span class="tg">${q.t}</span><span class="fr">${pLabel(p)} ${esc(p.name)}</span></div><div class="qt">${q.q}</div>${q.given?`<div class="given en">${q.given}</div>`:''}<div class="body en">${q.body}</div>${q.after?`<div class="given en">${q.after}</div>`:''}`;
 h+=`<div class="opts">${q.o.map((o,i)=>{let c='';if(done){if(i===q.a)c='ok';else if(i===Z.sel[Z.i])c='no'}else{if(i===Z.sel[Z.i])c='sel';if(Z.cut[Z.i].includes(i))c+=' cut'}return`<button class="opt ${c}" ${done?'disabled':''} onclick="pickOpt(${i})"><span class="rd"></span><span class="c">${C[i]}</span><span class="tx en" style="font-size:1rem">${o}</span></button>`}).join('')}</div>`;
 if(!done){const hn=Z.hint[Z.i];h+=hn?`<div class="hbox"><b>${hn}. ${['방향','선지 줄이기','선지 줄이기'][hn-1]}</b>${hn===1?TIP[q.t]||'':`${Z.cut[Z.i].map(x=>C[x]).join(', ')}번은 정답이 아니에요.`}${hn<3?`<div style="text-align:right;margin-top:6px"><button style="color:var(--pri);font-weight:700" onclick="useHint()">다음 힌트 →</button></div>`:''}</div>`:`<button class="hintb" onclick="useHint()">${IC.bulb} 힌트</button>`}
 else{const ok=Z.res[Z.i];h+=`<div class="exp"><div class="res ${ok?'ok':'no'}">${ok?'정답이에요!':'아쉬워요. 정답은 '+C[q.a]}</div>${q.e}${koAll(p)}</div>`}
 h+=`<div style="height:30px"></div>`;
 app.innerHTML=h;
 document.getElementById('tabbar').insertAdjacentHTML('afterend','');
 let f=document.getElementById('pfoot');if(!f){f=document.createElement('div');f.id='pfoot';f.className='pfoot';document.body.appendChild(f)}
 const last=Z.i===n-1;
 f.innerHTML=`<div class="in"><button class="obtn" ${Z.i===0?'disabled style="opacity:.4"':''} onclick="moveQ(-1)">← 이전</button><span>${Z.i+1} / ${n}</span>${done?`<button class="gbtn" onclick="${last?'finish()':'moveQ(1)'}">${last?'결과 보기':'다음 →'}</button>`:`<button class="gbtn" id="cfm" ${Z.sel[Z.i]==null?'disabled':''} onclick="confirmQ()">확인</button>`}</div>`;
 stopTimer();TM=setInterval(()=>{const e=document.getElementById('tm');if(e)e.textContent=fmt(Math.floor((Date.now()-S.play.t0)/1000))},1000)}
function pickOpt(i){const Z=S.play;if(Z.done[Z.i]||Z.cut[Z.i].includes(i))return;Z.sel[Z.i]=i;vPlay()}
function useHint(){const Z=S.play;const q=Z.list[Z.i];if(Z.hint[Z.i]>=3)return;Z.hint[Z.i]++;if(Z.hint[Z.i]>=2){const pool=q.o.map((_,k)=>k).filter(k=>k!==q.a&&!Z.cut[Z.i].includes(k));if(pool.length>1){const k=pool[rnd(pool.length)];Z.cut[Z.i].push(k);if(Z.sel[Z.i]===k)Z.sel[Z.i]=null}}vPlay()}
function confirmQ(){const Z=S.play;const q=Z.list[Z.i];if(Z.sel[Z.i]==null)return;Z.done[Z.i]=true;const ok=Z.sel[Z.i]===q.a;Z.res[Z.i]=ok;
 const w=loadW();if(Z.mode==='wrong'){if(ok&&q.wid){const k=w.findIndex(x=>x.wid===q.wid);if(k>=0){w.splice(k,1);saveW(w)}}}
 else if(!ok){w.unshift({...q,wid:Date.now()+'-'+rnd(1e6),at:Date.now()});saveW(w.slice(0,200))}
 document.getElementById('wcount').textContent=loadW().length;vPlay()}
function moveQ(d){const Z=S.play;Z.i=Math.max(0,Math.min(Z.list.length-1,Z.i+d));vPlay();scrollTo(0,0)}

(function(){try{const _s=Storage.prototype.setItem;Storage.prototype.setItem=function(k,v){_s.call(this,k,v);if(this===localStorage&&SYNC_KEYS.includes(k)&&!SY.applying){_s.call(this,'finale_local_at',String(Date.now()));queuePush()}}}catch(e){}})();
function queuePush(){if(!SY.user)return;clearTimeout(SY.timer);SY.timer=setTimeout(pushNow,1500)}
function doc(){return firebase.firestore().collection('finale').doc(SY.user.uid)}
async function pushNow(){if(!SY.user)return;try{SY.busy=true;const at=Date.now();await doc().set({data:localBundle(),updatedAt:at});SY.last=String(at);localStorage.setItem('finale_synced_at',SY.last);SY.err=null}catch(e){SY.err='올리기 실패: '+(e.code||e.message)}SY.busy=false;refreshAcct()}
function mergeWrong(a,b){const A=JSON.parse(a||'[]'),B=JSON.parse(b||'[]');const m=new Map();[...A,...B].forEach(q=>{const k=q.wid||JSON.stringify([q.pid,q.t,q.q]);if(!m.has(k))m.set(k,q)});return JSON.stringify([...m.values()].sort((x,y)=>(y.at||0)-(x.at||0)).slice(0,200))}
async function pullNow(first){if(!SY.user)return;try{SY.busy=true;refreshAcct();const s=await doc().get();
 if(!s.exists){await pushNow();return}
 const r=s.data(),rd=r.data||{},remoteNewer=(r.updatedAt||0)>localStamp();
 SY.applying=true;
 SYNC_KEYS.forEach(k=>{if(k==='efinal_wrong_v1'){localStorage.setItem(k,mergeWrong(localStorage.getItem(k),rd[k]));return}if(remoteNewer&&rd[k]!=null)localStorage.setItem(k,rd[k])});
 localStorage.setItem('finale_local_at',String(Math.max(r.updatedAt||0,localStamp())));
 SY.applying=false;await pushNow();
 if(remoteNewer&&first){sessionStorage.setItem('finale_after_pull','1');location.reload();return}
}catch(e){SY.applying=false;SY.err='불러오기 실패: '+(e.code||e.message)}SY.busy=false;refreshAcct()}

/* 모의고사 설정: 칩·체크 누를 때 화면이 안 튀게 */
vSetup=function(){const s=S.setup;
 app.innerHTML=`<h1 class="t">실전 모의고사</h1><p class="st">범위와 유형을 고르면 문제를 새로 섞어서 만들어요.</p>
 <div class="card w">
 <div class="lab" style="margin-top:0">범위</div><div class="chips">${lessons().map(l=>`<button class="chip ${s.L.includes(l)?'on':''}" data-l="${l}" onclick="tgL(this)">올림포스 ${l}강</button>`).join('')}</div>
 <div class="lab">문제 개수</div><div class="chips" id="ncs">${[10,20,30,50].map(n=>`<button class="chip ${s.n===n?'on':''}" data-n="${n}" onclick="setN(this)">${n}개</button>`).join('')}</div>
 <div class="lab ty">유형 <button class="chip" id="allb" style="padding:3px 10px;margin-left:6px;font-size:.8rem" onclick="tgAll()"></button></div>
 <div id="cbs">${TYPES.map(([n])=>`<button class="cb ${s.T.includes(n)?'on':''}" data-t="${n}" onclick="tgT(this)"><i></i>${n}</button>`).join('')}</div>
 <div class="est"><span id="estl"></span><b id="estv"></b></div>
 <button class="gbtn" id="mkb" onclick="startMock()">문제 만들기</button></div>`;updSetup()};
function updSetup(){const s=S.setup;const g=id=>document.getElementById(id);g('estl').textContent=`예상 풀이 시간 (${s.n}문항)`;g('estv').textContent=`약 ${Math.round(s.n*1.6)}분`;g('mkb').disabled=!s.L.length||!s.T.length;g('allb').textContent=s.T.length===TYPES.length?'모두 해제':'모두 선택'}
function tgL(b){const s=S.setup,l=+b.dataset.l;s.L=s.L.includes(l)?s.L.filter(x=>x!==l):[...s.L,l];b.classList.toggle('on');updSetup()}
function tgT(b){const s=S.setup,t=b.dataset.t;s.T=s.T.includes(t)?s.T.filter(x=>x!==t):[...s.T,t];b.classList.toggle('on');updSetup()}
function setN(b){S.setup.n=+b.dataset.n;document.querySelectorAll('#ncs .chip').forEach(x=>x.classList.toggle('on',x===b));updSetup()}
function tgAll(){const s=S.setup;const all=s.T.length===TYPES.length;s.T=all?[]:TYPES.map(x=>x[0]);document.querySelectorAll('#cbs .cb').forEach(x=>x.classList.toggle('on',!all));updSetup()}
