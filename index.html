addP({id:'16-15',L:16,n:15,name:'흡혈귀가 없는 이유',gist:'흡혈귀가 한 달에 한 명씩만 물어도 수가 두 배씩 늘어 2년 반 만에 인류가 사라진다. 그런데 인류는 멀쩡하니 흡혈귀는 없다.',key:[1,9],
s:[[`According to legend, once a vampire bites a person, that person turns into a vampire who seeks the blood of others.`,`전설에 따르면 흡혈귀가 사람을 물면, 그 사람은 다른 사람의 피를 찾는 흡혈귀로 변한다.`],
[`A researcher came up with some simple math, which proves that these highly popular creatures can't exist.`,`한 연구자가 간단한 계산을 생각해 냈는데, 그것은 이 매우 인기 있는 존재가 있을 수 없음을 증명한다.`],
[`University of Central Florida physics professor Costas Efthimiou's work breaks down the myth.`,`센트럴 플로리다 대학교 물리학 교수 Costas Efthimiou의 연구가 그 신화를 무너뜨린다.`],
[`Suppose that on January 1st, 1600, the human population was just over five hundred million.`,`1600년 1월 1일에 인구가 5억 명을 조금 넘었다고 가정해 보자.`],
[`If the first vampire came into existence that day and bit one person a month, there would have been two vampires by February 1st, 1600.`,`그날 최초의 흡혈귀가 생겨나 한 달에 한 명씩 물었다면, 1600년 2월 1일에는 흡혈귀가 둘이 되었을 것이다.`],
[`A month later there would have been four, the next month eight, then sixteen, and so on.`,`한 달 뒤에는 넷, 그다음 달엔 여덟, 그다음엔 열여섯, 이런 식으로 늘었을 것이다.`],
[`In just two-and-a-half years, the original human population would all have become vampires with no humans left.`,`단 2년 반 만에 원래 인류는 모두 흡혈귀가 되어 인간은 한 명도 남지 않았을 것이다.`],
[`But look around you.`,`하지만 주위를 둘러보라.`],
[`Have vampires taken over the world?`,`흡혈귀가 세상을 점령했는가?`],
[`No, because there's no such thing.`,`아니다, 그런 것은 없으니까.`]],

irr:[{at:1,s:`However, too many special effects can distract viewers from the story itself.`,k:`하지만 너무 많은 특수 효과는 시청자가 이야기 자체에 집중하지 못하게 할 수 있다.`,e:`특수 효과를 바로 받아서 자연스러워 보여요. 하지만 글은 비선형 편집의 "장점"을 하나씩 쌓는 중이에요. 단점 이야기는 방향이 반대고, 다음 Another highlight(또 다른 장점)와도 끊겨요.`},{at:4,s:`Typewriters were invented in the 1860s and quickly became popular in offices.`,k:`타자기는 1860년대에 발명되어 사무실에서 빠르게 인기를 끌었다.`,e:`타자기 비유 바로 뒤라 그럴듯해요. 하지만 타자기의 역사는 비유의 핵심(실수하면 전체를 다시 쳐야 함)과 무관해요.`}],
ins:[{i:2,e:`Another highlight: 앞 장점(특수 효과)에 이어 또 다른 장점.`},{i:6,e:`on the other hand: 선형(타자기)과 대조되는 비선형(워드).`},{i:4,e:`선형 편집 비유 시작. 앞 문단이 비선형 장점, 뒤가 타자기의 불편함.`}],
oi:1,cut:[3,6],oe:`특수 효과 + Another highlight 임의 접근 / 추가·삭제·자동 조정 + 선형은 타자기 + 전체 다시 / on the other hand 비선형은 워드 + 쉽게 수정.`});

addP({id:'17-3',L:17,n:3,name:'인간의 잠수 반사',gist:'인간도 해양 포유류처럼 얼굴이 물에 잠기면 잠수 반사가 일어나 기도를 닫고 심박을 늦추며 장기를 보호한다. 침팬지·고릴라에게는 없다.',key:[0,5],
s:[[`We have a 'diving reflex', like other marine mammals.`,`우리는 다른 해양 포유류처럼 '잠수 반사'를 가지고 있다.`],
[`This means that special nerve endings on our faces, around the mouth and nose, trigger this reflex only when the facial region goes under water.`,`이는 입과 코 주변 얼굴의 특수 신경 말단이 얼굴 부위가 물속에 들어갈 때만 이 반사를 일으킨다는 뜻이다.`],
[`If we are in the water, with our head out in the air, there is no diving reflex.`,`머리를 공기 중에 내놓은 채 물속에 있으면 잠수 반사는 없다.`],
[`But if we sink just our face in a bowl of water, while the whole of the rest of our body is in the dry air, the diving reflex is triggered.`,`하지만 몸의 나머지 전체는 마른 공기 중에 있고 얼굴만 그릇의 물에 담그면, 잠수 반사가 일어난다.`],
[`It automatically closes down the airway, reducing the risk of swallowing water, and it narrows the small air-passages in the lungs.`,`그것은 자동으로 기도를 닫아 물을 삼킬 위험을 줄이고, 폐 속의 작은 공기 통로를 좁힌다.`],
[`At the same time the heart rate is slowed down to half speed and blood is shunted to the vital organs, protecting them from the effects of the brief stop in breathing.`,`동시에 심박수가 절반 속도로 느려지고 혈액이 생명 유지에 중요한 장기로 보내져, 잠깐 숨이 멈추는 것의 영향으로부터 장기를 보호한다.`],
[`By contrast, if a chimpanzee or a gorilla found itself in water with its face below the surface, it would panic, its heart would race and it would quickly drown.`,`대조적으로, 침팬지나 고릴라가 얼굴이 수면 아래에 있는 채로 물속에 있게 되면, 겁에 질리고 심장이 마구 뛰며 금방 익사할 것이다.`]],

irr:[{at:2,s:`Many people also feel calmer after splashing cold water on their face.`,k:`많은 사람이 얼굴에 찬물을 끼얹고 나면 더 차분해지는 것을 느낀다.`,e:`얼굴·물이 겹쳐서 진짜 이어지는 것 같아요. 하지만 "기분"은 이 글의 초점(얼굴이 물에 "잠겨야" 반사가 일어남)과 무관하고, 다음 But(얼굴만 담그면 일어남) 대조와도 끊겨요.`},{at:5,s:`Whales and seals can stay underwater for more than an hour at a time.`,k:`고래와 물개는 한 번에 한 시간 넘게 물속에 있을 수 있다.`,e:`해양 포유류는 첫 문장에 나온 소재라 그럴듯해요. 하지만 지금은 인간의 반사 효과를 설명한 직후, By contrast로 침팬지와 대조하려는 순간이에요. 고래 이야기가 끼면 대조 흐름이 깨져요.`}],

addP({id:'17-5',L:17,n:5,name:'상사 형질과 상동 형질',gist:'기능이 같지만 따로 진화한 상사 형질과, 기능은 달라도 공통 조상에서 온 상동 형질을 구별하려면 쓸모없는 구조적 특징을 본다.',key:[0,6],
s:[[`Biologists distinguish two kinds of similarity.`,`생물학자들은 두 종류의 유사성을 구별한다.`],
[`"Analogous" traits are ones that have a common function but arose on different branches of the evolutionary tree and are in an important sense not "the same" organ.`,`'상사' 형질은 공통된 기능을 가지지만 진화 계통수의 다른 가지에서 생겨났고, 중요한 의미에서 '같은' 기관이 아닌 형질이다.`],
[`The wings of birds and the wings of bees are both used for flight and are similar in some ways because anything used for flight has to be built in those ways, but they arose independently in evolution and have nothing in common beyond their use in flight.`,`새의 날개와 벌의 날개는 둘 다 비행에 쓰이고, 비행에 쓰이는 것은 무엇이든 그런 식으로 만들어져야 하기 때문에 어떤 면에서 비슷하지만, 진화에서 독립적으로 생겨났고 비행에 쓰인다는 것 외에는 공통점이 없다.`],
[`"Homologous" traits, in contrast, may or may not have a common function, but they descended from a common ancestor and hence have some common structure that indicates their being "the same" organ.`,`반면 '상동' 형질은 공통 기능이 있을 수도 없을 수도 있지만, 공통 조상에서 내려왔기 때문에 그것들이 '같은' 기관임을 보여 주는 어떤 공통 구조를 가진다.`],
[`The wing of a bat and the front leg of a horse have very different functions, but they are all modifications of the forelimb of the ancestor of all mammals.`,`박쥐의 날개와 말의 앞다리는 기능이 매우 다르지만, 모두 모든 포유류 조상의 앞다리가 변형된 것이다.`],
[`As a result, they share nonfunctional traits like the number of bones and the ways they are connected.`,`그 결과 그것들은 뼈의 개수와 연결 방식 같은 비기능적 특징을 공유한다.`],
[`To distinguish analogy from homology, biologists usually look at the overall architecture of the organs and focus on their most useless properties.`,`상사성과 상동성을 구별하기 위해 생물학자들은 보통 기관의 전체 구조를 살펴보고 가장 쓸모없는 특성에 집중한다.`]],

addP({id:'17-7',L:17,n:7,name:'유년기가 주는 유연성',gist:'유년기는 환경을 배우게 해 유연성을 준다. 이동 방법을 타고난 새는 바뀐 환경에 적응 못 하지만, 부모에게 배운 새는 가장 효율적인 경로로 이동한다.',key:[0,7],
s:[[`Spending time as children allows animals to learn about their environment.`,`어린 시절을 보내는 것은 동물이 자기 환경에 대해 배울 수 있게 해 준다.`],
[`Without childhood, animals must rely more fully on hardware, and therefore be less flexible.`,`유년기가 없으면 동물은 하드웨어(타고난 것)에 더 전적으로 의존해야 하고, 그래서 덜 유연할 수밖에 없다.`],
[`Among migratory bird species, those that are born knowing how, when, and where to migrate — those that are migrating entirely with instructions they were born with — sometimes have very inefficient migration routes.`,`철새 종 가운데 어떻게, 언제, 어디로 이동할지 알고 태어나는 새들, 즉 전적으로 타고난 지침에 따라 이동하는 새들은 때때로 매우 비효율적인 이동 경로를 가진다.`],
[`These birds, born knowing how to migrate, don't adapt easily.`,`이동 방법을 알고 태어난 이 새들은 쉽게 적응하지 못한다.`],
[`So when lakes dry up, forest becomes farmland, or climate change pushes breeding grounds farther north, those birds that are born knowing how to migrate keep flying by the old rules and maps.`,`그래서 호수가 마르거나, 숲이 농지가 되거나, 기후 변화로 번식지가 더 북쪽으로 밀려나도, 이동 방법을 알고 태어난 새들은 옛 규칙과 지도대로 계속 날아간다.`],
[`By comparison, birds with the longest childhoods, and those that migrate with their parents, tend to have the most efficient migration routes.`,`이에 비해 유년기가 가장 길고 부모와 함께 이동하는 새들은 가장 효율적인 이동 경로를 가지는 경향이 있다.`],
[`Childhood facilitates the passing on of cultural information, and culture can evolve faster than genes.`,`유년기는 문화적 정보의 전달을 촉진하며, 문화는 유전자보다 빠르게 진화할 수 있다.`],
[`Childhood gives flexibility in a changing world.`,`유년기는 변화하는 세상에서 유연성을 준다.`]],

tf:[[`유년기는 동물이 환경에 대해 배울 수 있게 한다.`,true,`learn about their environment.`],[`유년기가 없으면 동물은 더 유연해진다.`,false,`덜 유연해진다.`],[`이동법을 타고난 철새는 때때로 비효율적인 경로를 가진다.`,true,`sometimes have very inefficient migration routes.`],[`이동법을 타고난 새는 환경 변화에 쉽게 적응한다.`,false,`쉽게 적응하지 못한다.`],[`부모와 함께 이동하는 새는 가장 효율적인 경로를 가지는 경향이 있다.`,true,`the most efficient migration routes.`],[`유전자는 문화보다 더 빨리 진화할 수 있다.`,false,`문화가 더 빠르다.`],[`유년기는 문화적 정보의 전달을 촉진한다.`,true,`facilitates the passing on of cultural information.`],[`기후 변화로 번식지가 더 남쪽으로 밀려났다.`,false,`더 북쪽으로(farther north).`]],
irr:[{at:3,s:`Some migratory birds fly more than 10,000 kilometers each year without stopping.`,k:`일부 철새는 매년 쉬지 않고 1만 킬로미터 넘게 난다.`,e:`철새 이동이라는 소재가 같아서 그럴듯해요. 하지만 글은 "타고난 새는 적응 못 함"을 이어서 설명하는 중이에요. 다음 So(그래서 옛 지도대로)와 연결이 끊겨요.`},{at:5,s:`However, young birds that migrate with their parents face a higher risk of being caught by predators.`,k:`하지만 부모와 함께 이동하는 어린 새는 포식자에게 잡힐 위험이 더 크다.`,e:`바로 앞 "부모와 함께 이동"을 받아서 진짜 헷갈려요! 그런데 갑자기 단점을 꺼내요. 다음 문장 "유년기는 문화 전달을 촉진"이라는 장점 흐름과 정면으로 어긋나요.`}],
ins:[{i:1,e:`Without childhood: 앞 "유년기 → 배움"을 반대 경우로 뒤집어 설명.`},{i:4,e:`So: 앞 "쉽게 적응 못 함"의 구체적 결과.`},{i:5,e:`By comparison: 타고난 새(앞) ↔ 유년기가 긴 새 대조.`}],
oi:1,cut:[3,5],oe:`하드웨어 의존 + 타고난 철새 비효율 / 적응 못 함 + 옛 지도대로 / By comparison 유년기 긴 새 + 문화 전달 + 유연성.`});

addP({id:'17-9',L:17,n:9,name:'쿠바 야구와 빨간 유니폼',gist:'세계 야구를 지배하던 쿠바는 상징이던 빨간 유니폼을 바꾼 뒤 쇠퇴했다. 팀은 시대에 맞춰 변해도 뿌리(전통)를 버리면 안 된다.',key:[7],
s:[[`Between 1940 and 2000, Cuba ruled the world baseball scene.`,`1940년부터 2000년까지 쿠바는 세계 야구계를 지배했다.`],
[`They won 25 of the first 28 World Cups and 3 of 5 Olympic Games.`,`그들은 첫 28번의 월드컵 중 25번, 올림픽 5번 중 3번을 우승했다.`],
[`The Cubans were known for wearing uniforms covered in red from head to toe, a strong contrast to the more conservative North American style featuring grey or white pants.`,`쿠바 선수들은 머리부터 발끝까지 빨간색으로 덮인 유니폼을 입는 것으로 알려졌는데, 이는 회색이나 흰색 바지가 특징인 더 보수적인 북미 스타일과 강하게 대조되었다.`],
[`Not only were their athletic talents superior, the Cubans appeared even stronger from just the colour of their uniforms.`,`쿠바 선수들은 운동 재능이 뛰어났을 뿐 아니라, 유니폼 색깔만으로도 훨씬 더 강해 보였다.`],
[`A game would not even start and the opposing team would already be scared.`,`경기가 시작도 하기 전에 상대 팀은 이미 겁을 먹곤 했다.`],
[`A few years ago, Cuba altered that uniform style, modernizing it and perhaps conforming to other countries' style; interestingly, the national team has declined since that time.`,`몇 년 전 쿠바는 그 유니폼 스타일을 바꿔 현대화하고 아마도 다른 나라 스타일에 맞췄는데, 흥미롭게도 그때부터 국가 대표 팀이 쇠퇴해 왔다.`],
[`The country that ruled international baseball for decades has not been on top since that uniform change.`,`수십 년간 국제 야구를 지배했던 그 나라는 유니폼 교체 이후 정상에 오르지 못했다.`],
[`Traditions are important for a team; while a team brand or image can adjust to keep up with present times, if it abandons or neglects its roots, negative effects can surface.`,`전통은 팀에게 중요하다. 팀 브랜드나 이미지는 현시대에 맞춰 조정될 수 있지만, 뿌리를 버리거나 소홀히 하면 부정적인 영향이 드러날 수 있다.`]],

irr:[{at:2,s:`Red is also the color most often used in national flags around the world.`,k:`빨간색은 또한 전 세계 국기에 가장 자주 쓰이는 색이다.`,e:`빨간 유니폼 바로 뒤라 이어지는 것 같지만, 국기 색 통계는 "쿠바 팀의 상징과 전통"이라는 논지와 무관해요.`},{at:5,s:`Many fans actually welcomed the new uniforms as a sign of progress.`,k:`많은 팬들은 실제로 새 유니폼을 발전의 신호로 반겼다.`,e:`유니폼 교체 바로 뒤라 진짜 그럴듯해요! 하지만 글은 "바꾼 뒤 쇠퇴"로 가고 있어요. 팬들이 반겼다는 긍정 평가는 흐름을 반대로 틀고, 다음 문장(정상에서 내려옴)과 어긋나요.`}],
ins:[{i:3,e:`Not only ~: 앞 빨간 유니폼 설명 다음, 재능 + 유니폼 효과.`},{i:5,e:`A few years ago: 과거의 영광(앞)에서 변화 시점으로 전환.`},{i:7,e:`앞 사례를 일반화하는 주제문.`}],

addP({id:'17-11',L:17,n:11,name:'매 순간 변하는 얼굴',gist:'얼굴처럼 너무 느리게 변하는 것은 변화를 못 느끼지만, 실제로는 순간순간 변하고 있다.',key:[0,6],
s:[[`Sometimes the pace of change is far slower.`,`때때로 변화의 속도는 훨씬 더 느리다.`],
[`The face you saw reflected in your mirror this morning probably appeared no different from the face you saw the day before — or a week or a month ago.`,`오늘 아침 거울에 비친 얼굴은 아마 전날, 혹은 일주일이나 한 달 전에 본 얼굴과 다르지 않아 보였을 것이다.`],
[`Yet we know that the face that stares back at us from the glass is not the same, cannot be the same, as it was 10 minutes ago.`,`하지만 우리는 거울 속에서 우리를 마주 보는 얼굴이 10분 전과 같지 않고, 같을 수도 없다는 것을 안다.`],
[`The proof is in your photo album: Look at a photograph taken of yourself 5 or 10 years ago and you see clear differences between the face in the snapshot and the face in your mirror.`,`증거는 사진첩에 있다. 5년이나 10년 전에 찍힌 자기 사진을 보면 스냅 사진 속 얼굴과 거울 속 얼굴 사이에 분명한 차이가 보인다.`],
[`If you lived in a world without mirrors for a year and then saw your reflection, you might be surprised by the change.`,`거울 없는 세상에서 1년을 살다가 자기 모습을 보면, 그 변화에 놀랄지도 모른다.`],
[`After an interval of 10 years without seeing yourself, you might not at first recognize the person peering from the mirror.`,`10년 동안 자기 모습을 보지 않다가 보면, 거울에서 응시하는 사람을 처음엔 알아보지 못할지도 모른다.`],
[`Even something as basic as our own face changes from moment to moment.`,`우리 자신의 얼굴처럼 아주 기본적인 것조차 순간순간 변한다.`]],

'7-1':[{at:1,s:`In many countries, the number of animals used in research has been decreasing for decades.`,k:`많은 나라에서 연구에 쓰이는 동물의 수는 수십 년간 줄어 왔다.`,e:`동물 실험 소재는 같지만, 통계는 "상관관계 ≠ 인과관계" 논쟁과 무관해요. 다음 Opponents reject this inference와도 끊겨요.`},{at:2,s:`Some defenders, however, admit that animal research is often expensive and slow.`,k:`하지만 일부 옹호자들은 동물 연구가 종종 비싸고 느리다는 것을 인정한다.`,e:`옹호자 이야기를 다시 꺼내서 그럴듯하지만, 비용·속도는 논지와 무관. 다음 After all(반대자의 근거)과도 안 이어져요.`}],
'7-3':[{at:1,s:`Many scientists believe that this point could be reached within the next few decades.`,k:`많은 과학자는 이 지점에 앞으로 수십 년 안에 도달할 수 있다고 믿는다.`,e:`특이점 정의 바로 뒤라 이어지는 것 같지만, 시기 예측은 "공진화" 논지와 무관하고 다음 After that point와 연결이 흐려져요.`},{at:6,s:`Still, most AI systems today are designed only to complete simple tasks.`,k:`그래도 오늘날 대부분의 AI 시스템은 단순 작업만 하도록 설계되어 있다.`,e:`AI 현실 이야기라 그럴듯하지만, "인간 의식이 AI 진화에 영향"이라는 흐름을 끊고 다음 The direction of AI's evolution과도 안 맞아요.`}],
'7-5':[{at:0,s:`Of course, our behaviors can also be influenced by the weather and our mood.`,k:`물론 우리 행동은 날씨나 기분의 영향을 받기도 한다.`,e:`행동 이야기라 자연스럽지만 정체성과 무관한 요인이에요. 다음 What you do is an indication of ~ (정체성)과 끊겨요.`},{at:6,s:`Changing habits, however, usually takes at least two months of daily practice.`,k:`하지만 습관을 바꾸는 데는 보통 매일 연습해서 적어도 두 달이 걸린다.`,e:`"행동 변화" 단어를 받아서 엄청 그럴듯해요! 하지만 글은 "정체성이 맞으면 변화 노력이 필요 없다"는 쪽이라 정반대 방향이에요.`}],
'7-7':[{at:0,s:`In fact, toy companies release new products every season to keep children interested.`,k:`사실 장난감 회사들은 아이들의 흥미를 유지하려고 매 시즌 신제품을 낸다.`,e:`장난감 예시를 이어 가는 것 같지만, 회사 전략은 "신경 세포 반응" 논지와 무관해요.`},{at:3,s:`Nerve cells are also responsible for sending pain signals to the brain.`,k:`신경 세포는 통증 신호를 뇌로 보내는 역할도 한다.`,e:`nerve cells를 그대로 받아서 진짜 헷갈려요. 하지만 통증은 "지루함의 원리"와 무관하고 다음 At the same time(변화엔 반응 강화)과 끊겨요.`}],
'7-9':[{at:0,s:`Stress hormones also help people react quickly in dangerous situations.`,k:`스트레스 호르몬은 위험한 상황에서 사람이 빠르게 반응하도록 돕기도 한다.`,e:`스트레스 호르몬을 받아서 그럴듯하지만, 장점 이야기는 논지와 무관하고 다음 However(부유한 나라도 스트레스)로 이어지지 않아요.`},{at:3,s:`Interestingly, people in wealthier nations also tend to walk faster in the street.`,k:`흥미롭게도 부유한 나라 사람들은 길에서 더 빨리 걷는 경향도 있다.`,e:`"빠른 삶의 속도"와 딱 맞아 보여서 제일 헷갈려요! 하지만 글은 연구 결과를 요약해 결론(In effect)으로 가는 중이라, 걷는 속도 같은 세부 사례는 흐름을 끊어요.`}],
'7-11':[{at:1,s:`Good listeners usually nod and make eye contact during conversations.`,k:`잘 듣는 사람은 대화 중에 보통 고개를 끄덕이고 눈을 맞춘다.`,e:`대화 장면이라 이어지는 것 같지만, 경청 태도는 "옳다는 확신의 함정"이라는 논지와 달라요.`},{at:5,s:`Indeed, being right most of the time is a sign of strong intelligence.`,k:`실제로 대부분 옳다는 것은 뛰어난 지능의 표시이다.`,e:`"옳다"를 칭찬해서 그럴듯하지만, 바로 다음 However(다른 관점이 이롭다)와 방향이 꼬여요.`}],
'14-1':[{at:1,s:`Many countries have promised to reach zero emissions by 2050.`,k:`많은 나라가 2050년까지 탄소 배출 제로 달성을 약속했다.`,e:`배출·전환 소재라 그럴듯하지만, 국가 목표는 "건설에 화석 연료가 필요하다"는 논지와 무관해요.`},{at:4,s:`Steel, in fact, can be recycled many times without losing its strength.`,k:`사실 강철은 강도를 잃지 않고 여러 번 재활용될 수 있다.`,e:`강철 바로 뒤라 정보 추가처럼 보여요. 하지만 재활용 이야기는 "화석 연료 필요"라는 흐름과 무관하고 다음 태양광 광물 예시와 끊겨요.`}],
'14-3':[{at:0,s:`Most plants need about six hours of sunlight a day to grow well.`,k:`대부분의 식물은 잘 자라려면 하루 약 6시간의 햇빛이 필요하다.`,e:`식물 이야기라 자연스럽지만, 햇빛은 "의사소통·SOS"와 무관해요.`},{at:7,s:`Some plants even grow faster when people talk to them.`,k:`어떤 식물은 사람이 말을 걸어 주면 더 빨리 자라기도 한다.`,e:`"소리"를 이어 가서 엄청 헷갈려요! 하지만 글은 식물이 "내는" 소리 이야기고, 다음 문장(물 부족 vs 잎 절단 소리)과도 끊겨요.`}],
'14-5':[{at:2,s:`The book became a bestseller among science students around the world.`,k:`그 책은 전 세계 과학도들 사이에서 베스트셀러가 되었다.`,e:`책 소개를 잇는 것 같지만, 판매량은 본질주의 논지와 무관해요.`},{at:4,s:`Fortunately, modern scientists always test their concepts before using them.`,k:`다행히 현대 과학자들은 개념을 쓰기 전에 항상 검증한다.`,e:`과학자 이야기를 이어 가서 그럴듯하지만, 글은 과거의 헛된 탐색 사례(에테르)로 가는 중이에요. always도 과장이고 다음 Firestein gives the example과 끊겨요.`}],
'14-7':[{at:2,s:`Many people find it easier to write down ideas than to speak them aloud.`,k:`많은 사람이 아이디어를 말로 하기보다 적는 것을 더 쉽게 여긴다.`,e:`writing을 받아서 진짜 그럴듯해요. 하지만 글은 단계를 순서대로 설명하는 중(먼저 → 다음 → 그 후)이라, 개인 선호 이야기는 흐름을 끊어요.`},{at:7,s:`Large companies, however, often prefer quick decisions made by a few leaders.`,k:`하지만 대기업은 소수 리더의 빠른 결정을 선호하는 경우가 많다.`,e:`팀·의사 결정 소재라 그럴듯하지만, 브레인라이팅의 효과를 정리하는 흐름과 반대 방향이에요.`}],

'14-13':[{at:1,s:`Some houses today are built in only a few days using 3D printers.`,k:`오늘날 어떤 집은 3D 프린터로 며칠 만에 지어진다.`,e:`집 예시를 받아서 그럴듯하지만, 건설 속도는 "마음속에서 먼저 완성"이라는 논지와 무관해요.`},{at:6,s:`However, unexpected events often force us to give up our plans.`,k:`하지만 예상치 못한 일들이 종종 계획을 포기하게 만든다.`,e:`미래·계획 이야기라 엄청 헷갈려요. 하지만 바로 다음이 "모든 생각·결정·행동이 조화롭게 작용"이라 정면으로 어긋나요.`}],
'14-15':[{at:0,s:`Fresh fruit is also an important source of vitamins and fiber.`,k:`신선한 과일은 비타민과 섬유질의 중요한 공급원이기도 하다.`,e:`신선함의 장점이라 반대 방향. 다음 While freshness ~ marketing과도 끊겨요.`},{at:4,s:`Some supermarkets now sell imperfect vegetables at lower prices.`,k:`일부 슈퍼마켓은 이제 못생긴 채소를 더 싸게 판다.`,e:`낭비 줄이기 사례라 그럴듯하지만, 글은 낭비 "문제"를 고발하는 흐름이에요. 다음 Tristram Stuart의 과잉 주문 비판과도 끊겨요.`}],
'16-1':[{at:3,s:`Cycling on level roads is also good exercise for your legs.`,k:`평평한 길에서 자전거를 타는 것은 다리 운동으로도 좋다.`,e:`자전거·평평한 길이라 자연스럽지만, 운동 효과는 "마찰력" 설명과 무관해요.`},{at:9,s:`Oil is often added to axles to make bicycles quieter.`,k:`자전거를 더 조용하게 하려고 축에 기름을 넣곤 한다.`,e:`축 마찰 바로 뒤라 진짜 그럴듯해요! 하지만 "조용하게"는 마찰력이 느리게 한다는 흐름과 무관하고, 다음 Another is air resistance(또 다른 마찰)와 끊겨요.`}],
'16-3':[{at:0,s:`Stanford is one of the most famous universities in the United States.`,k:`스탠퍼드는 미국에서 가장 유명한 대학 중 하나다.`,e:`소속 소개처럼 보이지만 논지와 무관해요.`},{at:4,s:`On the other hand, some children perform well without any praise at all.`,k:`반면 어떤 아이들은 칭찬이 전혀 없어도 잘 해낸다.`,e:`On the other hand로 대조처럼 들려서 헷갈려요. 하지만 글은 "어떤 칭찬이냐"를 비교하는 중이라, 칭찬 없는 아이는 비교 대상 밖이에요.`}],
'16-5':[{at:5,s:`Our ears can hear sounds between about 20 and 20,000 hertz.`,k:`우리 귀는 대략 20~2만 헤르츠의 소리를 들을 수 있다.`,e:`귀·주파수라 과학 설명처럼 보이지만, 가청 범위는 "두 경로" 설명과 무관하고 다음 One is the route와 끊겨요.`},{at:9,s:`Some people use special headphones that send music through the bones.`,k:`어떤 사람들은 뼈를 통해 음악을 보내는 특수 헤드폰을 쓴다.`,e:`뼈 전도 원리라 진짜 헷갈려요! 하지만 글은 "내 목소리가 왜 깊게 들리나"의 결론(That makes ~)으로 가는 중이라 흐름이 끊겨요.`}],
'16-7':[{at:2,s:`Squirrels play an important role in spreading tree seeds in forests.`,k:`다람쥐는 숲에서 나무 씨앗을 퍼뜨리는 중요한 역할을 한다.`,e:`다람쥐·숲 소재지만, 생태적 역할은 "외래종이 토종을 밀어냄"과 무관해요.`},{at:5,s:`Many British people, in fact, prefer the appearance of red squirrels.`,k:`사실 많은 영국인은 붉은 다람쥐의 생김새를 더 좋아한다.`,e:`붉은 다람쥐를 편드는 말이라 그럴듯하지만, 선호도는 멸종 원인과 무관하고 마지막 As a result를 끊어요.`}],
'16-9':[{at:1,s:`Teenagers also need more sleep than adults to stay healthy.`,k:`십 대는 건강을 위해 어른보다 잠이 더 필요하다.`,e:`청소년 이야기라 자연스럽지만 수면은 의사 결정 논지와 무관해요.`},{at:6,s:`As people grow older, the limbic system becomes completely inactive.`,k:`사람이 나이 들면 대뇌변연계는 완전히 활동을 멈춘다.`,e:`대뇌변연계를 이어 가서 엄청 헷갈려요. 하지만 본문에 없는 과장이고, 다음 these differences(성숙 시기 차이)와도 끊겨요.`}],
'16-11':[{at:1,s:`Wheat and barley were among the first crops grown by early farmers.`,k:`밀과 보리는 초기 농부들이 기른 최초의 작물들이었다.`,e:`농사 이야기라 그럴듯하지만, 작물 종류는 "공동체 효율"과 무관해요.`},{at:5,s:`However, dividing work sometimes caused arguments among villagers.`,k:`하지만 일을 나누는 것은 때때로 마을 사람들 사이에 다툼을 일으켰다.`,e:`분업을 받아서 진짜 그럴듯해요! 그런데 단점이라 흐름이 반대. 다음 also learned to work together(장점 추가)와 끊겨요.`}],
'16-13':[{at:3,s:`Beech wood is widely used to make furniture because it is hard and strong.`,k:`너도밤나무 목재는 단단하고 튼튼해서 가구를 만드는 데 널리 쓰인다.`,e:`너도밤나무 정보지만, 목재 용도는 "당 나누기"와 무관해요.`},{at:7,s:`Fungi in the soil also help connect the roots of different trees.`,k:`흙 속 균류도 서로 다른 나무의 뿌리를 연결하는 데 도움을 준다.`,e:`뿌리·연결이라 과학적으로 맞는 말 같아서 제일 헷갈려요! 하지만 글은 "넉넉하면 주고 부족하면 받는다"로 가는 중이라, 균류 이야기는 다음 Whoever ~ 와 연결을 끊어요.`}],
'16-15':[{at:0,s:`Vampire stories first became popular in Eastern Europe.`,k:`흡혈귀 이야기는 동유럽에서 처음 인기를 끌었다.`,e:`전설 이야기라 이어 보이지만, 기원은 "계산으로 반박"과 무관해요.`},{at:6,s:`Of course, vampires could also have died from sunlight or garlic.`,k:`물론 흡혈귀는 햇빛이나 마늘 때문에 죽었을 수도 있다.`,e:`계산의 허점을 짚는 것처럼 보여서 헷갈려요. 하지만 필자의 결론(그러니 없다)으로 가는 흐름을 끊어요.`}],

const DV={
'7-1':{p:[[0,`Critics of animal testing claim that modern medicine is not the only reason people now live longer, and that many important medical breakthroughs did not come from experiments on animals.`,`동물 실험 비판자들은 현대 의학이 사람들이 오늘날 더 오래 사는 유일한 이유가 아니며, 많은 중요한 의학적 돌파구도 동물 실험에서 나오지 않았다고 주장한다.`],[3,`In fact, there are separate reasons why we should expect the two to appear together.`,`사실 우리가 그 둘이 함께 나타날 거라고 예상해야 하는 별개의 이유들이 있다.`],[6,`Furthermore, a number of respected doctors have pointed to historical records showing that animal research contributed less to biomedical discoveries than its supporters claim.`,`게다가 존경받는 여러 의사들이 동물 연구가 지지자들의 주장보다 생의학적 발견에 덜 기여했음을 보여 주는 역사적 기록을 제시해 왔다.`]],
 a:[[2,`To them, a strong connection between two things does not automatically mean that one causes the other.`,`그들에게 두 가지 사이의 강한 연관성이 곧 하나가 다른 하나의 원인이라는 뜻은 아니다.`],[5,`In other words, the law itself, not the success of animal testing, creates the pattern we observe.`,`다시 말해, 우리가 보는 패턴을 만드는 것은 동물 실험의 성공이 아니라 법 그 자체다.`]]},
'7-3':{p:[[2,`Beyond that point, experts expect AI to keep upgrading itself and to develop faster and faster.`,`그 지점을 넘어서면 전문가들은 AI가 스스로를 계속 업그레이드하며 점점 더 빠르게 발전할 것으로 예상한다.`],[5,`Through our interactions with AI, our own minds may reach new levels, as AI challenges our thinking and sparks fresh ideas and creativity.`,`AI와의 상호 작용을 통해 우리 마음은 새로운 수준에 이를 수 있는데, AI가 우리의 생각에 도전하고 새로운 아이디어와 창의성을 일으키기 때문이다.`],[7,`What AI becomes will largely be shaped by the values and ethical standards that we build into it.`,`AI가 무엇이 될지는 우리가 그 안에 심는 가치와 윤리 기준에 의해 크게 결정될 것이다.`]],
 a:[[4,`In this sense, the relationship between humans and AI will no longer flow in only one direction.`,`이런 의미에서 인간과 AI의 관계는 더 이상 한 방향으로만 흐르지 않을 것이다.`],[7,`If we teach it care and respect, it is likely to reflect those qualities back to us.`,`우리가 AI에게 배려와 존중을 가르친다면, AI도 그 자질을 우리에게 되돌려 줄 가능성이 크다.`]]},
'7-5':{p:[[0,`In most cases, the way you act reflects who you think you are.`,`대부분의 경우 당신이 행동하는 방식은 당신이 스스로를 누구라고 생각하는지를 반영한다.`],[3,`For instance, those who saw themselves as 'voters' turned out to vote more often than those who merely said that voting was something they hoped to do.`,`예를 들어, 자신을 '유권자'로 본 사람들은 투표가 하고 싶은 일이라고 말만 한 사람들보다 실제로 더 자주 투표했다.`],[6,`That is because, once your actions and your sense of self are perfectly aligned, you are no longer trying to change your behavior.`,`그 이유는 행동과 자아 인식이 완벽하게 맞춰지면, 더 이상 행동을 바꾸려 애쓰지 않기 때문이다.`]],
 a:[[2,`In other words, belief comes first, and behavior tends to follow.`,`다시 말해, 믿음이 먼저 오고 행동은 뒤따르는 경향이 있다.`],[5,`There is no inner struggle, because the action simply fits who you are.`,`내적 갈등이 없다. 그 행동이 그냥 당신이라는 사람에 맞기 때문이다.`]]},
'7-7':{p:[[0,`Children get tired of their toys, college students grow bored of cafeteria meals, and eventually most of us stop caring about our favorite TV programs.`,`아이들은 장난감에 싫증 내고, 대학생들은 구내식당 식사에 질리며, 결국 우리 대부분은 좋아하던 TV 프로그램에 관심을 잃는다.`],[5,`This probably developed through evolution, because our ancestors gained more survival benefits by watching what moved in a tree, such as a puma, than by watching the tree itself.`,`이는 아마 진화를 통해 생겼을 텐데, 조상들은 나무 자체보다 퓨마처럼 나무에서 움직이는 것을 지켜봄으로써 더 큰 생존 이익을 얻었기 때문이다.`],[7,`It works just like switching off a porch light so that the fireflies become visible.`,`그것은 반딧불이가 보이도록 현관 불을 끄는 것과 똑같이 작동한다.`]],
 a:[[1,`This happens to almost everyone, regardless of age.`,`이것은 나이와 상관없이 거의 모든 사람에게 일어난다.`],[4,`A sudden movement, therefore, catches our attention much more easily than something that stays still.`,`그래서 갑작스러운 움직임은 가만히 있는 것보다 훨씬 쉽게 우리 주의를 끈다.`]]},
'7-9':{p:[[1,`Wealthy economies, however, come with stresses of their own.`,`그러나 부유한 경제에도 그 나름의 스트레스가 따른다.`],[2,`The central problem is a lack of time.`,`핵심 문제는 시간 부족이다.`],[4,`In short, a fast-paced, productive economy generates wealth, yet it also makes people feel short of time when they cannot find moments to rest and have fun.`,`요컨대, 빠르고 생산적인 경제는 부를 만들지만, 쉬고 즐길 틈을 찾지 못할 때 사람들이 시간이 부족하다고 느끼게도 만든다.`]],
 a:[[2,`People in rich countries may have plenty of money, but they often feel that they never have enough hours in the day.`,`부유한 나라 사람들은 돈은 많을지 몰라도, 하루에 시간이 늘 부족하다고 느끼는 경우가 많다.`],[3,`In other words, the very speed that makes these nations rich also makes their people anxious.`,`다시 말해, 이 나라들을 부유하게 만드는 바로 그 속도가 사람들을 불안하게도 만든다.`]]},
'7-11':{p:[[2,`When you are convinced that you are right, you shut the door on other viewpoints and opportunities.`,`자신이 옳다고 확신하면, 다른 관점과 기회에 문을 닫아 버린다.`],[5,`Your way of seeing the situation may even match the facts.`,`상황을 보는 당신의 방식이 사실과 맞을 수도 있다.`],[9,`Apart from being boring, such a world would wipe out every new opportunity, idea, invention, and creative act.`,`지루함은 말할 것도 없고, 그런 세상은 모든 새로운 기회, 아이디어, 발명, 창의적인 행동을 없애 버릴 것이다.`]],
 a:[[3,`There is nothing more to discuss, and no reason to listen.`,`더 논의할 것도, 들을 이유도 없어진다.`],[7,`Even if you do not change your mind, you will understand the other person better.`,`생각을 바꾸지 않더라도 상대를 더 잘 이해하게 될 것이다.`]]},
'14-1':{p:[[1,`Nevertheless, this project turns out to be harder and more complicated than many of us might expect.`,`그럼에도 이 프로젝트는 우리 중 많은 이가 예상하는 것보다 더 어렵고 복잡하다.`],[3,`Such a transformation is impossible without the help of fossil fuels.`,`그런 변화는 화석 연료의 도움 없이는 불가능하다.`],[8,`According to Heinberg, plans for the energy transition rarely include the cost of building this new infrastructure, since they usually focus only on how much energy needs to be supplied.`,`Heinberg에 따르면 에너지 전환 계획은 대개 얼마나 많은 에너지를 공급해야 하는지에만 집중하기 때문에, 이 새로운 기반 시설을 짓는 비용을 거의 포함하지 않는다.`]],
 a:[[5,`Even wind turbines need huge amounts of steel and concrete, which are produced mainly with coal and oil.`,`풍력 터빈조차 엄청난 양의 강철과 콘크리트가 필요한데, 그것들은 주로 석탄과 석유로 만들어진다.`],[7,`In this way, the effort to escape fossil fuels can, at least for a while, deepen our dependence on them.`,`이런 식으로 화석 연료에서 벗어나려는 노력이 적어도 한동안은 오히려 화석 연료 의존을 깊게 만들 수 있다.`]]},
'14-3':{p:[[1,`Some plants show their unhappiness by releasing scents.`,`어떤 식물은 냄새를 내뿜어 불만을 드러낸다.`],[6,`To find out whether plants make any distress calls, researchers placed microphones near them and recorded the results.`,`식물이 조난 신호를 내는지 알아보려고 연구자들은 식물 근처에 마이크를 두고 결과를 녹음했다.`],[9,`Experts, however, do not believe that plants are actually crying out in pain.`,`그러나 전문가들은 식물이 실제로 고통에 울부짖는다고 생각하지 않는다.`]],
 a:[[3,`The smell is released when the plant's leaves are damaged.`,`그 냄새는 식물의 잎이 손상될 때 방출된다.`],[8,`In other words, a plant seems to send different signals depending on what kind of trouble it is in.`,`다시 말해 식물은 어떤 곤경에 처했는지에 따라 다른 신호를 보내는 것 같다.`]]},
'14-5':{p:[[1,`They lead us to see things that are not really there.`,`개념은 실제로 존재하지 않는 것을 보게 만든다.`],[3,`This saying perfectly captures what it means to search for essences.`,`이 말은 본질을 찾는다는 것이 무엇인지 완벽하게 담아낸다.`],[5,`As an example, Firestein mentions luminiferous ether, a mysterious material that people once believed filled the universe so that light could travel through it.`,`예로 Firestein은 빛이 통과해 이동할 수 있도록 우주를 채우고 있다고 한때 사람들이 믿었던 신비한 물질, 발광 에테르를 언급한다.`]],
 a:[[1,`Once we have a concept in mind, we tend to assume that something real must stand behind it.`,`일단 개념이 머릿속에 생기면, 우리는 그 뒤에 실제로 무언가가 있을 거라고 가정하는 경향이 있다.`],[4,`They kept looking simply because their concepts told them there must be something to find.`,`그들은 단지 개념이 찾을 게 있다고 말해 주었기 때문에 계속 찾았다.`]]},
'14-7':{p:[[0,`If we want to discover the hidden potential of a team, we should replace brainstorming with a process known as brainwriting.`,`팀의 숨은 잠재력을 발견하고 싶다면, 브레인스토밍을 브레인라이팅이라는 과정으로 바꿔야 한다.`],[2,`First, everyone is asked to come up with ideas on their own.`,`먼저 모든 사람이 각자 아이디어를 떠올리도록 요청받는다.`],[7,`Through this process, every idea gets put on the table, and every voice becomes part of the discussion.`,`이 과정을 통해 모든 아이디어가 테이블에 오르고, 모든 목소리가 논의의 일부가 된다.`]],
 a:[[3,`Because no names are attached, members judge each idea on its own merits rather than on who suggested it.`,`이름이 붙어 있지 않기 때문에 구성원들은 누가 냈는지가 아니라 아이디어 자체의 가치로 판단한다.`],[6,`Quiet members, whose ideas are often ignored in open discussions, can finally be heard.`,`공개 토론에서 자주 무시되던 조용한 구성원들의 아이디어도 마침내 들릴 수 있다.`]]},
'14-9':{p:[[0,`According to anthropologist Gregory Bateson, we usually make sense of the world by focusing on specific features of it.`,`인류학자 Gregory Bateson에 따르면 우리는 보통 세상의 특정한 특징에 집중함으로써 세상을 이해한다.`],[3,`Or we might zoom out until it looks like one single, uniform object.`,`또는 그것이 하나의 균일한 물체처럼 보일 때까지 축소할 수도 있다.`],[6,`The key point, however, is that we can hold only one perspective at any given moment.`,`그러나 핵심은 우리가 어느 순간에든 하나의 관점만 가질 수 있다는 것이다.`]],
 a:[[1,`This strange animal can be seen at many different levels.`,`이 이상한 동물은 여러 다른 수준에서 볼 수 있다.`],[6,`When we look at the hairs, we lose sight of the ecosystem, and when we look at the ecosystem, we lose sight of the hairs.`,`털을 보면 생태계를 놓치고, 생태계를 보면 털을 놓친다.`]]},
'14-11':{p:[[0,`Other people's body language influences our own bodies, which in turn produce an emotional echo that makes us feel the same way.`,`다른 사람의 몸짓은 우리 몸에 영향을 주고, 우리 몸은 다시 우리가 똑같이 느끼게 하는 감정의 메아리를 만든다.`],[4,`For instance, simply raising the corners of our mouth can lift our mood.`,`예를 들어 입꼬리를 올리기만 해도 기분이 좋아질 수 있다.`],[6,`This idea that the body comes first is sometimes summed up as "I must be afraid, because I'm running."`,`몸이 먼저라는 이 생각은 때때로 "나는 달리고 있으니 두려운 게 분명해"로 요약된다.`]],
 a:[[2,`In this way, a smile can spread from one person to another almost like a yawn.`,`이런 식으로 미소는 하품처럼 한 사람에게서 다른 사람에게로 퍼질 수 있다.`],[5,`The pencil did not change the cartoons; it changed the shape of their faces, and their feelings followed.`,`연필이 만화를 바꾼 게 아니라 얼굴 모양을 바꿨고, 감정이 그 뒤를 따랐다.`]]},
'14-13':{p:[[1,`The homes we live in, the cars we drive, and the clothes we wear all started out as ideas.`,`우리가 사는 집, 모는 차, 입는 옷은 모두 아이디어에서 출발했다.`],[5,`We start with an idea of what the future will look like.`,`우리는 미래가 어떤 모습일지에 대한 아이디어로 시작한다.`],[6,`Over time, we polish and complete that picture.`,`시간이 흐르며 우리는 그 그림을 다듬고 완성한다.`]],
 a:[[3,`Without that clear mental picture, the builder would not know where to drive the first nail.`,`그 분명한 마음속 그림이 없으면 건축가는 첫 못을 어디에 박아야 할지 모를 것이다.`],[6,`The clearer the picture becomes, the more naturally our daily choices begin to move toward it.`,`그림이 선명해질수록 우리의 일상적 선택은 더 자연스럽게 그쪽으로 움직이기 시작한다.`]]},
'14-15':{p:[[0,`Our desire for fresh food may come with environmental costs that are not easy to see.`,`신선한 음식을 원하는 마음에는 눈에 잘 띄지 않는 환경적 비용이 따를 수 있다.`],[2,`This demand has also added to worries about wasted food.`,`이 요구는 음식 낭비에 대한 걱정도 키웠다.`],[4,`Activists have revealed the scandal of producing too much and throwing it away.`,`활동가들은 너무 많이 생산하고 버리는 추문을 폭로해 왔다.`]],
 a:[[1,`Strawberries in winter, for example, often come from heated greenhouses or are flown in from far away.`,`예를 들어 겨울 딸기는 대개 난방한 온실에서 오거나 먼 곳에서 비행기로 실려 온다.`],[3,`Food that is still safe to eat is often thrown away simply because a date on the label has passed.`,`아직 먹어도 안전한 음식이 단지 라벨의 날짜가 지났다는 이유로 버려지는 경우가 많다.`]]}};
Object.assign(DV,{
'16-1':{p:[[3,`You slow down little by little.`,`당신은 조금씩 느려진다.`],[5,`You put on the brakes.`,`브레이크를 걸면 된다.`],[10,`Another is air resistance, which you can actually feel pushing you back as you move forward.`,`또 하나는 공기 저항으로, 앞으로 나아갈 때 당신을 뒤로 미는 것을 실제로 느낄 수 있다.`]],
 a:[[7,`So friction always works against the direction in which an object is moving.`,`그래서 마찰력은 언제나 물체가 움직이는 방향과 반대로 작용한다.`],[10,`That is why a bicycle on a flat road will eventually stop even if nothing else gets in its way.`,`그래서 평평한 길의 자전거는 아무것도 막지 않아도 결국 멈추게 된다.`]]},
'16-3':{p:[[2,`On the other hand, Dweck discovered that children who are praised for their effort, not their intelligence, develop what she calls a "growth mindset."`,`반면 Dweck은 지능이 아니라 노력으로 칭찬받은 아이들이 그녀가 "성장 사고방식"이라 부르는 것을 발달시킨다는 것을 발견했다.`],[4,`As a result, these children are more willing to take on harder challenges, and they feel better about themselves.`,`그 결과 이 아이들은 더 어려운 도전을 기꺼이 받아들이고, 자신에 대해 더 좋게 느낀다.`],[5,`As Dweck has put it, "Emphasizing effort gives a child a variable that they can control."`,`Dweck의 말처럼 "노력을 강조하면 아이에게 스스로 통제할 수 있는 변수를 준다."`]],
 a:[[1,`They are afraid that failing at a hard task will prove they were never smart after all.`,`그들은 어려운 과제에서 실패하면 자신이 애초에 똑똑하지 않았다는 게 드러날까 봐 두려워한다.`],[3,`Mistakes become chances to learn rather than proof of failure.`,`실수는 실패의 증거가 아니라 배울 기회가 된다.`]]},
'16-5':{p:[[3,`This is, of course, a very common experience.`,`이것은 물론 아주 흔한 경험이다.`],[5,`When we speak, we hear our own voice in two different ways.`,`말할 때 우리는 두 가지 다른 방식으로 자기 목소리를 듣는다.`],[8,`These vibrations travel through our bones and directly stimulate our inner ears.`,`이 진동은 뼈를 통해 이동해 내이를 직접 자극한다.`]],
 a:[[4,`It has to do with how the sound of your voice reaches your ears.`,`그것은 목소리가 귀에 도달하는 방식과 관련이 있다.`],[6,`This is also the only way other people hear your voice.`,`이것은 또한 다른 사람들이 당신의 목소리를 듣는 유일한 방식이다.`]]},
'16-7':{p:[[1,`The red and grey squirrels of Britain offer a clear example of this.`,`영국의 붉은 다람쥐와 회색 다람쥐가 이것의 분명한 예를 보여 준다.`],[4,`In the same area of forest, grey squirrels can eat up the food supply before red squirrels get even a single bite.`,`같은 숲 지역에서 회색 다람쥐는 붉은 다람쥐가 한 입 먹기도 전에 식량을 다 먹어 치울 수 있다.`],[6,`Consequently, the red squirrel is now nearly extinct in England.`,`그 결과 붉은 다람쥐는 이제 잉글랜드에서 거의 멸종 상태다.`]],
 a:[[2,`The red squirrels had lived in Britain for thousands of years before the greys arrived.`,`붉은 다람쥐는 회색 다람쥐가 오기 전 수천 년 동안 영국에 살았다.`],[5,`In short, the newcomer was better at finding food and better at surviving change.`,`요컨대 새로 온 종이 먹이를 찾는 데도, 변화 속에서 살아남는 데도 더 뛰어났다.`]]},
'16-9':{p:[[0,`The teenage brain does not finish developing until a person is in their early twenties.`,`십 대의 뇌는 20대 초반이 되어서야 발달을 마친다.`],[3,`This is the part of the brain that stops you from sending an angry first text message and helps you rewrite it in gentler words.`,`이것이 처음 쓴 화난 문자를 보내지 못하게 막고 더 부드러운 말로 고쳐 쓰게 돕는 뇌 부위다.`],[8,`This may help explain why some teenagers are more likely to make poor choices.`,`이것이 왜 일부 십 대가 나쁜 선택을 할 가능성이 더 큰지 설명하는 데 도움이 될 수 있다.`]],
 a:[[3,`Because this area is still developing, teenagers often find it harder to stop and think before acting.`,`이 영역이 아직 발달 중이라 십 대는 행동하기 전에 멈추고 생각하기가 더 어렵다.`],[6,`In the moment, how a choice feels can matter more to a teenager than what it might lead to.`,`그 순간에는 선택이 가져올 결과보다 그 선택이 어떻게 느껴지는지가 십 대에게 더 중요할 수 있다.`]]},
'16-11':{p:[[0,`During the Old Stone Age, small groups of 20 to 60 people moved from place to place looking for food.`,`구석기 시대에는 20~60명의 작은 집단이 식량을 찾아 이곳저곳을 이동했다.`],[2,`Towns and villages, as a result, became larger.`,`그 결과 마을과 촌락이 더 커졌다.`],[8,`Working together allowed them to produce more tools in the same amount of time.`,`함께 일하자 같은 시간에 더 많은 도구를 만들 수 있었다.`]],
 a:[[1,`They no longer had to follow animals or search for wild plants every day.`,`그들은 더 이상 매일 동물을 쫓거나 야생 식물을 찾아다닐 필요가 없었다.`],[5,`Each person could focus on one kind of work and become better at it.`,`각자 한 종류의 일에 집중해서 그 일을 더 잘하게 될 수 있었다.`]]},
'16-13':{p:[[0,`Every beech tree grows in its own spot, and the soil can change greatly within just a few yards.`,`너도밤나무는 저마다 자기 자리에서 자라며, 토양은 단 몇 야드 안에서도 크게 달라질 수 있다.`],[4,`Surprisingly, however, the rate is the same.`,`그러나 놀랍게도 그 비율은 같다.`],[7,`This takes place below the ground, through the roots.`,`이 일은 땅 아래에서 뿌리를 통해 일어난다.`]],
 a:[[3,`A tree in rich, wet soil should have a clear advantage over a tree in dry, poor soil.`,`비옥하고 촉촉한 흙의 나무가 메마르고 척박한 흙의 나무보다 분명히 유리해야 할 것이다.`],[8,`In this way, the forest works less like a group of competitors and more like a community.`,`이런 식으로 숲은 경쟁자들의 집단이라기보다 하나의 공동체처럼 움직인다.`]]},
'16-15':{p:[[0,`Legend says that once a vampire bites someone, that person also becomes a vampire who hunts for other people's blood.`,`전설에 따르면 흡혈귀가 누군가를 물면 그 사람도 다른 사람의 피를 노리는 흡혈귀가 된다.`],[1,`However, a researcher has used some simple math to show that these popular creatures cannot be real.`,`그러나 한 연구자가 간단한 계산으로 이 인기 있는 존재가 실제일 수 없음을 보여 주었다.`],[6,`Within only two and a half years, every human in the original population would have turned into a vampire, leaving no humans at all.`,`단 2년 반 만에 원래 인구의 모든 인간이 흡혈귀로 변해 인간은 하나도 남지 않았을 것이다.`]],
 a:[[5,`The number of vampires would double every single month.`,`흡혈귀의 수는 매달 두 배가 될 것이다.`],[8,`Clearly, they have not.`,`분명히 그렇지 않았다.`]]},
'17-1':{p:[[0,`Today, every editing system is a nonlinear, computer-based system that lets editors jump straight to any shot or scene without fast forwarding or rewinding.`,`오늘날 모든 편집 시스템은 빨리 감기나 되감기 없이 어떤 숏이나 장면으로든 곧장 이동하게 해 주는 비선형 컴퓨터 기반 시스템이다.`],[4,`Linear editing was similar to writing a paper on a typewriter.`,`선형 편집은 타자기로 글을 쓰는 것과 비슷했다.`],[7,`When a mistake happens, it can be removed and corrected with just a few keystrokes, and new information can be inserted easily.`,`실수가 생기면 키 몇 번으로 지우고 고칠 수 있고, 새 정보도 쉽게 끼워 넣을 수 있다.`]],
 a:[[3,`Editors can try out different versions of a scene and choose the best one.`,`편집자는 한 장면의 여러 버전을 시도해 보고 가장 좋은 것을 고를 수 있다.`],[5,`Even a small change could cost hours of work.`,`작은 변경 하나에도 몇 시간의 작업이 들 수 있었다.`]]},
'17-3':{p:[[0,`Like other sea mammals, humans have what is called a 'diving reflex.'`,`다른 바다 포유류처럼 인간에게도 '잠수 반사'라는 것이 있다.`],[2,`When we are in water but our head stays in the air, the diving reflex does not occur.`,`물속에 있어도 머리가 공기 중에 있으면 잠수 반사는 일어나지 않는다.`],[6,`In contrast, if a chimpanzee or a gorilla ended up in water with its face under the surface, it would panic, its heart would beat wildly, and it would soon drown.`,`대조적으로 침팬지나 고릴라가 얼굴이 수면 아래로 잠긴 채 물에 빠지면, 겁에 질리고 심장이 마구 뛰며 곧 익사할 것이다.`]],
 a:[[3,`In other words, what matters is not the body but the face.`,`다시 말해 중요한 건 몸이 아니라 얼굴이다.`],[5,`All of this helps the body survive a short time without breathing.`,`이 모든 것이 짧은 시간 숨을 쉬지 못하는 상황에서 몸이 살아남도록 돕는다.`]]},
'17-5':{p:[[0,`Biologists recognize two different types of similarity.`,`생물학자들은 두 가지 다른 유형의 유사성을 인정한다.`],[4,`A bat's wing and a horse's front leg serve very different purposes, yet both are modified versions of the front limb of the ancestor of all mammals.`,`박쥐의 날개와 말의 앞다리는 매우 다른 용도로 쓰이지만, 둘 다 모든 포유류 조상의 앞다리가 변형된 것이다.`],[6,`To tell analogy apart from homology, biologists usually examine the overall structure of the organs and pay attention to their most useless features.`,`상사성과 상동성을 구별하기 위해 생물학자들은 보통 기관의 전체 구조를 살피고 가장 쓸모없는 특징에 주목한다.`]],
 a:[[2,`Their similarity comes from the job they do, not from a shared history.`,`그들의 유사성은 공통된 역사가 아니라 하는 일에서 나온다.`],[5,`These features have nothing to do with flying or running; they are simply left over from a shared past.`,`이 특징들은 날기나 달리기와 아무 관련이 없다. 그저 공통된 과거에서 남겨진 것이다.`]]},
'17-7':{p:[[0,`Having a childhood gives animals time to learn about the world around them.`,`유년기를 가지면 동물은 주변 세상에 대해 배울 시간을 얻는다.`],[3,`Because they are born knowing how to migrate, these birds have trouble adapting.`,`이동하는 법을 알고 태어나기 때문에 이 새들은 적응하는 데 어려움을 겪는다.`],[7,`In a changing world, childhood provides flexibility.`,`변화하는 세상에서 유년기는 유연성을 제공한다.`]],
 a:[[4,`Their instructions, once useful, now lead them in the wrong direction.`,`한때 유용했던 그들의 지침이 이제는 그들을 잘못된 방향으로 이끈다.`],[5,`Young birds learn from their parents where food and water can be found this year, not just in the past.`,`어린 새들은 과거만이 아니라 올해 어디서 먹이와 물을 찾을 수 있는지를 부모에게서 배운다.`]]},
'17-9':{p:[[0,`From 1940 to 2000, Cuba dominated world baseball.`,`1940년부터 2000년까지 쿠바는 세계 야구를 지배했다.`],[4,`Even before the game began, the other team would already feel afraid.`,`경기가 시작되기도 전에 상대 팀은 이미 겁을 먹곤 했다.`],[6,`Since that change in uniform, the country that once ruled international baseball has never returned to the top.`,`그 유니폼 변경 이후, 한때 국제 야구를 지배했던 그 나라는 다시 정상에 오르지 못했다.`]],
 a:[[3,`The red uniforms became a symbol of Cuban baseball itself.`,`빨간 유니폼은 쿠바 야구 그 자체의 상징이 되었다.`],[6,`The team lost not only its look but also part of its identity.`,`그 팀은 외모만이 아니라 정체성의 일부도 잃었다.`]]},
'17-11':{p:[[1,`The face you saw in the mirror this morning probably looked just like the one you saw yesterday, last week, or last month.`,`오늘 아침 거울에서 본 얼굴은 아마 어제, 지난주, 지난달에 본 얼굴과 똑같아 보였을 것이다.`],[4,`If you spent a year in a world without mirrors and then looked at yourself, the change might surprise you.`,`거울 없는 세상에서 1년을 보낸 뒤 자신을 보면, 그 변화에 놀랄지도 모른다.`],[6,`Even something as basic as our own face is changing every moment.`,`우리 자신의 얼굴처럼 아주 기본적인 것조차 매 순간 변하고 있다.`]],
 a:[[2,`The change is simply too small to notice from one day to the next.`,`그 변화는 하루하루 알아채기에는 그저 너무 작다.`],[3,`Our skin, our hair, and the shape of our face have all slowly shifted.`,`피부, 머리카락, 얼굴형이 모두 천천히 바뀌어 왔다.`]]},
'17-13':{p:[[1,`Complex carbohydrates are the good kind for your body.`,`복합 탄수화물은 몸에 좋은 종류다.`],[4,`Simple sugars, in contrast, are the bad carbohydrates.`,`대조적으로 단순당은 나쁜 탄수화물이다.`],[6,`Your body digests these carbohydrates quite fast, and whatever it cannot use is turned into fat and stored.`,`몸은 이 탄수화물을 꽤 빨리 소화하고, 쓸 수 없는 것은 무엇이든 지방으로 바뀌어 저장된다.`]],
 a:[[3,`This is why foods like whole grains can keep you feeling full for a long time.`,`그래서 통곡물 같은 음식은 오랫동안 배부른 느낌을 준다.`],[5,`That is why a sugary snack may give you a quick burst of energy, followed by a sudden drop.`,`그래서 단 간식은 순간적으로 에너지를 확 주었다가 갑자기 뚝 떨어뜨릴 수 있다.`]]},
'17-15':{p:[[0,`In the United States and Europe, watching television is the most popular leisure activity, taking up more than half of our free time.`,`미국과 유럽에서 TV 시청은 가장 인기 있는 여가 활동으로, 자유 시간의 절반 이상을 차지한다.`],[3,`In the short term, at least, watching television does meet these social needs to some degree.`,`적어도 단기적으로는 TV 시청이 이런 사회적 욕구를 어느 정도 정말로 채워 준다.`],[6,`Put another way, the more time we spend with Friends, the less time we spend with real friends.`,`달리 말하면, Friends와 보내는 시간이 많을수록 진짜 친구들과 보내는 시간은 줄어든다.`]],
 a:[[3,`We may feel as if the characters on screen are part of our own social circle.`,`화면 속 인물들이 우리 인간관계의 일부인 것처럼 느낄 수도 있다.`],[5,`Over time, this can leave us lonelier than before.`,`시간이 지나면 이것이 우리를 전보다 더 외롭게 만들 수 있다.`]]}});
/* 변형 지문 만들기 */
function deepVariant(p){const d=DV[p.id];if(!d)return null;const s0=p.s.map(x=>[x[0],x[1]]);const changed=[];
 d.p.forEach(([i,en,ko])=>{if(Math.random()<(window.HARDV?.95:.6)&&s0[i]){s0[i]=[en,ko];changed.push(i)}});
 const adds=d.a.filter(()=>Math.random()<(window.HARDV?.95:.7));const ns=[],map=[],added=[];
 s0.forEach((x,i)=>{map[i]=ns.length;ns.push(x);adds.filter(a=>a[0]===i).forEach(a=>{added.push(ns.length);ns.push([a[1],a[2]])})});
 if(!changed.length&&!added.length)return null;
 const v=Object.assign(Object.create(Object.getPrototypeOf(p)),p,{s:ns,deep:{changed:changed.map(i=>map[i]),added}});
 v.ins=p.ins.map(it=>({...it,i:map[it.i]}));v.cut=[map[p.cut[0]],map[p.cut[1]]];v.oi=map[(p.oi||1)-1]+1;v.irr=p.irr.map(r=>({...r,at:map[r.at]}));v.key=(p.key||[0]).map(i=>map[i]);
 if(!(v.cut[0]>v.oi&&v.cut[1]>v.cut[0]&&v.cut[1]<ns.length))v.cut=p.cut.map(c=>map[c]);return v}

const SYN=[['an important','a crucial'],['an idea','a notion'],['a great deal of','a lot of'],['For example,','For instance,'],['For instance,','For example,'],['Thus,','Therefore,'],['As a result,','Consequently,'],['Consequently,','As a result,'],['Moreover,','Furthermore,'],['In other words,','That is,'],['In contrast,','By contrast,'],['By contrast,','In contrast,'],['Look at','Examine'],['look at','examine'],
['often','frequently'],['usually','typically'],['quickly','rapidly'],['suddenly','abruptly'],['almost','nearly'],['probably','likely'],['Maybe','Perhaps'],['mainly','primarily'],['especially','particularly'],['completely','entirely'],['clearly','plainly'],['simply','merely'],['very','extremely'],['fairly','rather'],['several','a number of'],['Kids','Children'],['kids','children'],['ideas','notions'],['idea','notion'],['important','crucial'],['therefore','thus'],['difficult','hard'],['large','big'],['shown','demonstrated'],['begins','starts'],['began','started'],['begin','start'],['allowed','permitted'],['allows','permits'],['allowing','permitting'],['allow','permit'],['reduces','decreases'],['reducing','decreasing'],['reduce','decrease'],['creates','generates'],['create','generate'],['enhance','strengthen'],['evaluating','assessing'],['evaluates','assesses'],['perceive','sense'],['protecting','shielding'],['modifying','revising'],['widespread','extensive'],['scarce','rare'],['surprised','astonished'],['choosing','selecting'],['choose','select'],['try','attempt'],['people','individuals'],['huge','enormous'],['vital','essential'],['harm','damage'],['relies','depends'],['rely','depend'],['tougher','harder'],['enough','sufficient'],['concerns','worries'],['remarks','notes'],['suggests','proposes'],['argues','claims'],['primarily','mainly'],['frequently','often']];
const SYNRX=SYN.map(([a,b])=>[new RegExp(`(?<![A-Za-z'’-])${a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?![A-Za-z'’-])`,'g'),b,a]);
function protectList(p){const L=[];const add=x=>{if(!x)return;(Array.isArray(x)?x:[x]).forEach(s=>{if(typeof s==='string')L.push(clean(s))})};
 p.gram.forEach(g=>add(g.p));p.voc.forEach(v=>add(v.p));p.blanks.forEach(b=>add(b.p));(p.imps||[p.imp]).forEach(m=>add(m.p));if(p.ref)add(p.ref.ps);p.w.forEach(([w])=>add(w));return L.filter(s=>s.length>1)}
function variantOf(p){const prot=protectList(p);const swaps=[];
 const s=p.s.map(([en,ko])=>{const pr=[];prot.forEach(ph=>{let i=en.indexOf(ph);while(i>=0){pr.push([i,i+ph.length]);i=en.indexOf(ph,i+1)}});

'7-11':[[4,`Most experts agree that facts never change over time.`,`대부분의 전문가는 사실이 시간이 지나도 변하지 않는다고 동의한다.`,`"사실에 부합" 단어를 받았지만 논지와 무관하고, 다음 However와 연결이 안 돼요.`],[8,`That is why you should always trust your first impression.`,`그래서 항상 첫인상을 믿어야 한다.`,`결론처럼 들리지만 "다른 관점을 고려하라"와 정반대예요.`]],
'14-1':[[2,`Many people already use electric cars in big cities.`,`많은 사람이 이미 대도시에서 전기차를 쓴다.`,`교통 기반 시설을 받아서 그럴듯하지만, "화석 연료 없이는 불가능" 흐름과 무관해요.`],[7,`Fortunately, the price of solar panels has dropped sharply in recent years.`,`다행히 태양광 패널 가격이 최근 크게 떨어졌다.`,`"비싸다"를 받아 반박하는 것 같지만 본문 논지(숨은 비용)를 흐려요.`]],
'14-3':[[1,`Roses and lavender are popular because of their sweet scents.`,`장미와 라벤더는 달콤한 향기 때문에 인기가 많다.`,`향기 소재지만 "불만·SOS 신호"와 무관해요.`],[8,`Interestingly, some plants grow better when classical music is played.`,`흥미롭게도 어떤 식물은 클래식 음악을 틀면 더 잘 자란다.`,`소리 소재라 진짜 헷갈려요. 하지만 식물이 "내는" 소리 이야기이고, 다음 However(고통 아님)와 끊겨요.`]],
'14-5':[[0,`Concepts are also useful for learning a new language.`,`개념은 새 언어를 배울 때도 유용하다.`,`개념의 장점 추가라 흐름이 반대 방향이에요(위험성을 말하는 중).`],[6,`Today, physicists know that light can travel through empty space.`,`오늘날 물리학자들은 빛이 빈 공간을 지날 수 있다는 걸 안다.`,`맞는 과학 사실이라 제일 헷갈려요. 하지만 글은 "없는 고양이를 찾은" 비유로 끝나는 흐름이에요.`]],
'14-7':[[1,`Brainstorming was first made popular by an advertising executive in the 1940s.`,`브레인스토밍은 1940년대 한 광고 임원이 처음 유행시켰다.`,`브레인스토밍 역사는 단계 설명(먼저 혼자 → 다음 …) 흐름을 끊어요.`],[5,`However, choosing the best idea always takes a long time.`,`하지만 최고의 아이디어를 고르는 데는 항상 오래 걸린다.`,`선택 단계를 받아서 그럴듯하지만 단점 이야기라 방향이 반대예요.`]],
'14-9':[[0,`Bateson was also famous for his studies of Pacific island cultures.`,`Bateson은 태평양 섬 문화 연구로도 유명했다.`,`인물 소개라 그럴듯하지만 관점 논지와 무관해요.`],[6,`Platypuses, however, are among the few mammals that lay eggs.`,`하지만 오리너구리는 알을 낳는 몇 안 되는 포유류다.`,`오리너구리 사실 정보라 헷갈리지만 "관점" 흐름을 끊어요.`]],
'14-11':[[0,`Body language, however, differs greatly from culture to culture.`,`하지만 몸짓 언어는 문화마다 크게 다르다.`,`body language를 받았지만 "몸 → 감정" 논지와 무관해요.`],[3,`Scientists, however, still cannot measure happiness exactly.`,`하지만 과학자들은 여전히 행복을 정확히 측정하지 못한다.`,`다음 For example(입꼬리 예시)과 연결이 끊겨요.`]],
'14-13':[[1,`Most clothes today, in fact, are made in factories overseas.`,`사실 오늘날 대부분의 옷은 해외 공장에서 만들어진다.`,`옷 예시를 받았지만 "마음속 설계" 논지와 무관해요.`],[4,`However, many people find it hard to imagine their future clearly.`,`하지만 많은 사람이 미래를 분명히 상상하기 어려워한다.`,`미래 소재라 그럴듯하지만 "같은 과정으로 설계" 흐름과 반대예요.`]],
'14-15':[[2,`Many families now grow their own vegetables at home.`,`많은 가정이 이제 집에서 채소를 기른다.`,`채소 소재지만 숨은 비용·낭비 흐름과 무관해요.`],[5,`As a result, sandwiches have become the most popular lunch in Britain.`,`그 결과 샌드위치는 영국에서 가장 인기 있는 점심이 되었다.`,`샌드위치를 받아 결론처럼 보이지만 낭비 고발과 무관해요.`]],
'16-1':[[4,`Many cyclists wear helmets to protect their heads.`,`많은 자전거 타는 사람이 머리 보호를 위해 헬멧을 쓴다.`,`자전거 소재지만 마찰 설명과 무관해요.`],[10,`Racing cyclists, therefore, wear tight clothes to reduce air resistance.`,`그래서 경주용 자전거 선수는 공기 저항을 줄이려 몸에 붙는 옷을 입는다.`,`공기 저항을 받아서 진짜 헷갈려요. 하지만 응용 사례로 새서 다음 카트 적용과 끊겨요.`]],
'16-3':[[2,`Some schools now give awards only to the smartest students.`,`어떤 학교는 이제 가장 똑똑한 학생에게만 상을 준다.`,`"똑똑함" 소재지만 Dweck 연구 흐름을 끊어요.`],[5,`Still, most parents believe that talent matters more than effort.`,`그래도 대부분의 부모는 재능이 노력보다 중요하다고 믿는다.`,`마지막에 반대 의견을 붙여 논지를 흐려요.`]],
'16-5':[[1,`Voice recording apps are now available on most smartphones.`,`음성 녹음 앱은 이제 대부분의 스마트폰에 있다.`,`녹음 소재지만 "왜 다르게 들리나" 흐름과 무관해요.`],[6,`Hearing loss, however, is becoming more common among young people.`,`하지만 청력 손실은 젊은 층에서 점점 흔해지고 있다.`,`귀 이야기라 그럴듯하지만 두 경로 설명을 끊어요.`]],
'16-7':[[0,`Squirrels are found on every continent except Australia and Antarctica.`,`다람쥐는 호주와 남극을 뺀 모든 대륙에 산다.`,`다람쥐 정보지만 외래종 논지와 무관해요.`],[3,`Red squirrels, in fact, are better at climbing trees than greys.`,`사실 붉은 다람쥐는 회색보다 나무를 더 잘 탄다.`,`붉은 다람쥐 장점이라 흐름이 반대예요(회색의 우위를 설명 중).`]],
'16-9':[[0,`Teenagers' brains are also more active at night than adults'.`,`십 대의 뇌는 또한 밤에 어른보다 더 활발하다.`,`청소년 뇌 소재지만 결정 불균형 논지와 무관해요.`],[7,`Parents, therefore, should never let teenagers make their own decisions.`,`그러므로 부모는 절대 십 대가 스스로 결정하게 두면 안 된다.`,`결론처럼 들리지만 과장이고 본문에 없는 주장이에요.`]],
'16-11':[[3,`Some villages, in fact, were surrounded by walls for protection.`,`사실 일부 마을은 방어를 위해 성벽으로 둘러싸였다.`,`마을 소재지만 "효율적 조직" 흐름을 끊어요.`],[7,`Stone tools, however, broke easily and had to be replaced often.`,`하지만 돌 도구는 쉽게 부서져 자주 바꿔야 했다.`,`돌도끼를 받아 헷갈리지만 단점이라 방향이 반대예요.`]],
'16-13':[[0,`Beech forests are common in many parts of Europe.`,`너도밤나무 숲은 유럽 여러 곳에 흔하다.`,`너도밤나무 정보지만 "토양 차이" 흐름을 끊어요.`],[8,`However, some trees refuse to share and grow faster than others.`,`하지만 어떤 나무는 나누기를 거부하고 다른 나무보다 빨리 자란다.`,`나눔을 받아 반대로 틀어서 헷갈려요. 마지막 "아무도 뒤처지지 않게"와 모순.`]],
'16-15':[[3,`Vampire stories became especially popular after the novel Dracula was published.`,`흡혈귀 이야기는 소설 드라큘라 출간 이후 특히 인기를 끌었다.`,`흡혈귀 소재지만 계산 흐름과 무관해요.`],[7,`Of course, vampires may have avoided biting people in winter.`,`물론 흡혈귀는 겨울엔 사람을 물지 않았을 수도 있다.`,`계산의 허점처럼 보여 헷갈리지만 필자 결론으로 가는 흐름을 끊어요.`]],
'17-1':[[2,`Professional editors usually work in quiet, dark rooms.`,`전문 편집자들은 보통 조용하고 어두운 방에서 일한다.`,`편집자 소재지만 비선형 장점과 무관해요.`],[5,`Typewriters are still used by some writers today.`,`타자기는 오늘날에도 일부 작가가 쓴다.`,`타자기를 받았지만 비유의 핵심(수정이 어려움)과 무관해요.`]],
'17-3':[[0,`Some people can hold their breath for over ten minutes with training.`,`어떤 사람은 훈련으로 10분 넘게 숨을 참을 수 있다.`,`숨 참기라 그럴듯하지만 반사(자동 반응)와 무관해요.`],[3,`Cold water, however, is especially dangerous for small children.`,`하지만 찬물은 어린아이에게 특히 위험하다.`,`물 소재지만 반사 효과 설명을 끊어요.`]],
'17-5':[[3,`Bats, in fact, are the only mammals that can truly fly.`,`사실 박쥐는 진짜로 날 수 있는 유일한 포유류다.`,`박쥐를 받았지만 상동 형질 설명과 무관해요.`],[6,`Today, most biologists use DNA tests instead of looking at organs.`,`오늘날 대부분의 생물학자는 기관을 보는 대신 DNA 검사를 쓴다.`,`구별 방법 이야기라 제일 헷갈리지만, 마지막 문장(구조를 본다)과 정면으로 어긋나요.`]],
'17-7':[[1,`Some birds can fly for several days without landing.`,`어떤 새는 착륙하지 않고 며칠 동안 날 수 있다.`,`철새 소재지만 유년기 논지와 무관해요.`],[6,`However, young birds often get lost on their first migration.`,`하지만 어린 새는 첫 이동에서 자주 길을 잃는다.`,`부모와 이동을 받아 반대로 틀어서 헷갈려요. 유년기의 장점 흐름과 어긋나요.`]],
'17-9':[[0,`Baseball is also very popular in Japan and South Korea.`,`야구는 일본과 한국에서도 매우 인기가 있다.`,`야구 소재지만 쿠바 전통 논지와 무관해요.`],[4,`Red is, in fact, the most common color among national sports teams.`,`사실 빨간색은 국가 대표 팀들 사이에서 가장 흔한 색이다.`,`빨간색을 받았지만 쿠바만의 상징이라는 흐름과 어긋나요.`]],
'17-11':[[3,`Old photos, however, often lose their color over time.`,`하지만 오래된 사진은 시간이 지나면 색이 바래곤 한다.`,`사진을 받았지만 얼굴 변화 논지와 무관해요.`],[6,`That is why many people avoid looking in the mirror.`,`그래서 많은 사람이 거울 보기를 피한다.`,`결론처럼 들리지만 본문에 없는 내용이에요.`]],
'17-13':[[0,`Rice is the main food for more than half of the world's people.`,`쌀은 세계 인구 절반 이상의 주식이다.`,`탄수화물 음식이지만 구조 설명과 무관해요.`],[5,`Brown sugar, however, contains more minerals than white sugar.`,`하지만 흑설탕은 백설탕보다 무기질이 많다.`,`당·무기질 단어가 겹쳐 진짜 헷갈리지만 단순당 설명 흐름을 끊어요.`]],
'17-15':[[2,`Streaming services, in fact, release new shows every week.`,`사실 스트리밍 서비스는 매주 새 프로그램을 낸다.`,`프로그램 소재지만 외로움·관계 논지와 무관해요.`],[6,`Therefore, watching Friends with friends is the best way to relax.`,`그러므로 친구와 Friends를 보는 게 최고의 휴식이다.`,`말장난을 받아 결론처럼 보이지만 논지와 정반대예요.`]]};
